<style>
/* Direction : outil officiel du lycée, finition de logiciel. Une colonne, des listes à séparateurs fins,
   le bleu du lycée réservé à ce qui compte (inscription, action principale, marque). */
:root {
  --bleu: #145ff6;        /* bleu du logo du lycée (bas du dégradé) */
  --bleu-fort: #0f4fd6;
  --bleu-ciel: #00c8ff;   /* haut du dégradé du logo */
  --bleu-pale: #eef3fd;
  --fond: #f7f8fa;
  --surface: #ffffff;
  --survol: #f3f5f8;
  --trait: #e6e9ee;
  --trait-fort: #d2d7df;
  --encre: #101828;
  --encre-2: #475467;
  --discret: #8a94a6;
  --ambre: #b54708;
  --rouge: #c0362c;
  --vert: #067647;
  --voile: rgba(16, 24, 40, .32);
  --ombre: 0 1px 2px rgba(16, 24, 40, .05), 0 12px 32px -8px rgba(16, 24, 40, .18);
  --f: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r-s: 6px; --r: 10px; --r-l: 14px;
  --h: 40px;
  --t: 160ms cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bleu: #5b8ff5; --bleu-fort: #7aa6ff; --bleu-pale: #15213b;
    --fond: #0c0f14; --surface: #12161d; --survol: #181d26; --trait: #222935; --trait-fort: #2e3644;
    --encre: #e8ecf2; --encre-2: #a7b0bf; --discret: #6b7484;
    --ambre: #f0a35c; --rouge: #f07b70; --vert: #4cc38a; --voile: rgba(0, 0, 0, .55);
    --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -8px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bleu: #5b8ff5; --bleu-fort: #7aa6ff; --bleu-pale: #15213b;
  --fond: #0c0f14; --surface: #12161d; --survol: #181d26; --trait: #222935; --trait-fort: #2e3644;
  --encre: #e8ecf2; --encre-2: #a7b0bf; --discret: #6b7484;
  --ambre: #f0a35c; --rouge: #f07b70; --vert: #4cc38a; --voile: rgba(0, 0, 0, .55);
  --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font: 400 15px/1.5 var(--f); font-feature-settings: "tnum" 0;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; border-radius: var(--r-s); }
.chiffres { font-variant-numeric: tabular-nums; }
.app { max-width: 600px; margin: 0 auto; padding-inline: 20px; padding-block: 0 56px; }

/* ---------- Signature : liseré bleu du lycée en haut de l'écran ---------- */
body::before {
  content: ""; position: fixed; z-index: 30; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px;
  background: linear-gradient(90deg, var(--bleu-ciel), var(--bleu)); pointer-events: none;
}

/* ---------- En-tête ---------- */
.tete {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: -20px; padding: 0 12px 0 20px; height: 56px;
  display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--fond) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid transparent; transition: border-color var(--t);
}
.tete.defile { border-bottom-color: var(--trait); }
.marque { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.monogramme { width: 28px; height: 28px; flex: none; display: block; }
.marque .nom { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.marque .sous { color: var(--discret); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.retour { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 8px 0 2px; margin-left: -6px; border-radius: var(--r-s); color: var(--encre-2); font-weight: 500; font-size: 14px; flex: 1; min-width: 0; }
.retour svg { width: 18px; height: 18px; flex: none; }
.retour:hover { color: var(--encre); }
.icone { width: 36px; height: 36px; border-radius: var(--r-s); display: grid; place-items: center; color: var(--encre-2); flex: none; transition: background var(--t), color var(--t); }
.icone:hover { background: var(--survol); color: var(--encre); }
.icone svg { width: 18px; height: 18px; }
.icone.tourne svg { animation: tourne .6s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.initiales { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--trait-fort); font-size: 11px; font-weight: 600; color: var(--encre-2); display: grid; place-items: center; flex: none; transition: border-color var(--t); }
.initiales:hover { border-color: var(--encre-2); color: var(--encre); }

/* ---------- Titres de page ---------- */
.titre { padding-top: 28px; display: grid; gap: 4px; }
.titre h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -.022em; text-wrap: balance; }
.titre p { margin: 0; color: var(--encre-2); font-size: 15px; }
.section { margin-top: 36px; display: grid; gap: 10px; }
.section h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--encre-2); }
.section .tete-section { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.note { margin: 0; color: var(--discret); font-size: 13px; line-height: 1.5; }

/* Sélecteur de matière : le titre de la page est le menu */
.selecteur { position: relative; display: inline-flex; align-items: center; max-width: calc(100% + 8px); margin-left: -8px; justify-self: start; }
.selecteur select {
  appearance: none; -webkit-appearance: none; border: 0; background: transparent; cursor: pointer;
  font-size: 28px; font-weight: 600; letter-spacing: -.022em; line-height: 1.2;
  padding: 2px 34px 2px 8px; border-radius: var(--r); max-width: 100%; text-overflow: ellipsis;
  transition: background var(--t);
}
.selecteur select:hover { background: var(--survol); }
.selecteur select:focus-visible { outline: 2px solid var(--bleu); outline-offset: 0; }
.selecteur svg { position: absolute; right: 10px; width: 18px; height: 18px; color: var(--discret); pointer-events: none; }
.pastille { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--c, var(--discret)); }
/* Espace gestion : matière puis classe, côte à côte */
.selecteurs { display: flex; flex-wrap: wrap; align-items: center; column-gap: 4px; min-width: 0; }
.selecteurs h1 { margin-right: 6px; }
.selecteurs h1 + .selecteur, .selecteurs .selecteur + .selecteur { margin-left: 0; }
.selecteur.classe select { color: var(--discret); }
/* Programme et consignes d'une colle */
.programme { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--trait); border-left: 2px solid var(--bleu); border-radius: var(--r); background: var(--surface); }
.programme h2, .programme h4 { margin: 0; font-size: 13px; font-weight: 600; color: var(--encre-2); }
.programme p { margin: 0; font-size: 14px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; color: var(--encre); }
.programme-tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.programme.eleve { margin-top: 20px; }
.ajout-programme { justify-self: start; display: block; text-align: left; font-size: 14px; font-weight: 500; color: var(--bleu); padding: 2px 0; }
.ajout-programme span { color: var(--discret); font-weight: 400; }
.ajout-programme:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Listes ---------- */
.liste { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-l); overflow: hidden; }
.liste > * + * { border-top: 1px solid var(--trait); }
.ligne {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 12px 16px; text-align: left;
  transition: background var(--t);
}
button.ligne:hover, a.ligne:hover { background: var(--survol); }
button.ligne:active { background: var(--trait); }
.ligne .corps { flex: 1; min-width: 0; display: grid; gap: 1px; }
.ligne .principal { font-weight: 500; }
.ligne .secondaire { color: var(--discret); font-size: 13px; }
.ligne .droite { text-align: right; font-size: 14px; color: var(--encre-2); white-space: nowrap; }
.ligne .chev { width: 16px; height: 16px; color: var(--trait-fort); flex: none; margin-right: -4px; }
.ligne.courante .principal { font-weight: 600; }
.vide { padding: 20px 16px; color: var(--discret); font-size: 14px; }

/* États (texte d'abord, couleur ensuite) */
.e-libre { color: var(--encre-2); }
.e-dernier { color: var(--ambre); }
.e-complet { color: var(--discret); }
.e-inscrit { color: var(--bleu); font-weight: 500; }
.e-ferme { color: var(--discret); }
.e-annule { color: var(--rouge); }

/* ---------- Créneaux ---------- */
.jour { display: grid; gap: 10px; margin-top: 32px; }
.jour-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.jour-tete h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.jour-tete .qui { color: var(--discret); font-size: 13px; text-align: right; }
.creneau {
  position: relative; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 16px;
  width: 100%; min-height: 54px; padding: 0 16px; text-align: left; transition: background var(--t);
}
.creneau:not(:disabled):hover { background: var(--survol); }
.creneau:not(:disabled):active { background: var(--trait); }
.creneau:disabled { cursor: default; }
.creneau .cell-h { display: grid; gap: 1px; min-width: 0; padding-block: 8px; }
.creneau .noms { font-size: 13px; color: var(--discret); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.creneau.inscrit .noms { color: var(--encre-2); }
.creneau.lecture { grid-template-columns: 1fr auto; cursor: default; }
.creneau.lecture .noms { color: var(--encre-2); }
.creneau .heure { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.creneau .heure span { color: var(--discret); font-weight: 400; }
.creneau .etat { font-size: 14px; min-width: 92px; text-align: right; }
.sieges { display: inline-flex; gap: 4px; }
.siege { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--trait-fort); }
.siege.pris { background: var(--encre-2); border-color: var(--encre-2); }
.siege.moi { background: var(--bleu); border-color: var(--bleu); }
.creneau.inscrit { background: var(--bleu-pale); }
.creneau.inscrit::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--bleu); }
.creneau.complet .heure, .creneau.ferme .heure, .creneau.conflit .heure { color: var(--discret); }
.creneau.passe { opacity: .45; }
.annulee { padding: 16px; color: var(--rouge); font-size: 14px; }
.meta-seance { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: -4px 0 0; font-size: 14px; color: var(--discret); }
.meta-seance b { font-weight: 500; color: var(--encre); }
.infos { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; padding: 12px 0; border-block: 1px solid var(--trait); }
.infos div { display: grid; gap: 1px; }
.infos dt { font-size: 12px; color: var(--discret); }
.infos dd { margin: 0; font-size: 15px; font-weight: 500; }
.manque { color: var(--discret) !important; font-weight: 400 !important; }

/* ---------- Planning (agenda) ---------- */
.agenda .ligne { align-items: flex-start; padding-block: 14px; }
.date-col { width: 44px; flex: none; display: grid; justify-items: center; line-height: 1.1; padding-top: 1px; }
.date-col b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.date-col span { font-size: 12px; color: var(--discret); }
.agenda .heure { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--encre); }
.agenda .matiere { display: flex; align-items: center; gap: 8px; font-weight: 500; }

/* ---------- Bandeaux d'information ---------- */
.avis { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); font-size: 14px; border: 1px solid var(--trait); background: var(--surface); color: var(--encre-2); }
.avis svg { width: 16px; height: 16px; flex: none; margin-top: 3px; }
.avis b { color: var(--encre); font-weight: 500; }
.avis.attention { border-color: color-mix(in srgb, var(--ambre) 28%, var(--trait)); }
.avis.attention svg { color: var(--ambre); }
.avis.bleu { background: var(--bleu-pale); border-color: transparent; color: var(--encre); }
.avis.bleu svg { color: var(--bleu); }
.avis a { font-weight: 500; color: var(--encre); text-decoration-color: var(--trait-fort); text-underline-offset: 3px; }
.avis a:hover { text-decoration-color: currentColor; }
.avis .fermer-avis { margin-left: auto; color: var(--discret); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; }
.avis .fermer-avis:hover { color: var(--encre); background: var(--survol); }
.demo { margin: 16px 0 0; padding: 8px 12px; border-radius: var(--r); background: var(--survol); color: var(--encre-2); font-size: 13px; }
.demo b { font-weight: 600; color: var(--encre); }

/* ---------- Boutons ---------- */
.btn {
  height: var(--h); padding: 0 16px; border-radius: 8px; font-weight: 500; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
  border: 1px solid var(--trait-fort); background: var(--surface); color: var(--encre);
  transition: background var(--t), border-color var(--t), transform 80ms;
}
.btn:hover { background: var(--survol); }
.btn:active { transform: translateY(.5px); }
.btn.primaire { background: var(--bleu); border-color: var(--bleu); color: #fff; }
.btn.primaire:hover { background: var(--bleu-fort); border-color: var(--bleu-fort); }
:root[data-theme="dark"] .btn.primaire { color: #0c0f14; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primaire { color: #0c0f14; } }

    return code ? find(db.t("profs"), function (x) { return x.code && !x.pin && x.code.toUpperCase() === code; }) : null;
  }
  function profParNom(db, nom) { var n = normNom(nom); return n ? find(db.t("profs"), function (x) { return normNom(x.nom) === n; }) : null; }
  function hashCodeProf(nom, code) { return hash("prof|" + normNom(nom) + "|" + String(code).toUpperCase()); }
  // Nom + code : le code choisi par le prof, sinon celui donné par l'administrateur. Les erreurs sont comptées.
  function verifierCodeProf(db, pr, code, now) {
    code = str(code).toUpperCase();
    if (+pr.echecs >= MAX_ECHECS && now && minutesDe(now.iso) - minutesDe(pr.bloque) < BLOCAGE_MIN)
      throw err("Trop d'essais avec un code incorrect. Réessayez dans un quart d'heure.");
    var bon = !!code && (pr.pin ? hashCodeProf(pr.nom, code) === pr.pin : !!pr.code && pr.code.toUpperCase() === code);
    if (!bon) {
      pr.echecs = String((+pr.echecs >= MAX_ECHECS ? 0 : +pr.echecs || 0) + 1);
      pr.bloque = now ? now.iso : ""; db.touch("profs"); db.commit();
      throw err("Code incorrect.");
    }
    if (pr.echecs && pr.echecs !== "0") { pr.echecs = "0"; pr.bloque = ""; db.touch("profs"); }
  }
  function porteeProf(db, pr) {
    var mp = matieresDuProf(db, pr);
    if (!mp.length) throw err("Code reconnu, mais aucune matière n'est associée à " + pr.nom + ". L'administrateur doit compléter la liste des professeurs.");
    return { admin: false, matieres: mp, prof: pr.nom, colleur: pr.role === "colleur" };
  }
  function gestionAuth(db, p, now) {
    var code = str(p.gcode).toUpperCase(), nom = str(p.gnom);
    if (!code) throw err("Code de gestion requis.");
    if (nom) {
      var pr = profParNom(db, nom);
      if (!pr) throw err("Code incorrect : ce nom n'est plus dans la liste des professeurs.");
      verifierCodeProf(db, pr, code, now);
      return porteeProf(db, pr);
    }
    var admin = code === String(db.reglage("code_admin", "")).toUpperCase();
    var ids = db.t("matieres").filter(function (m) { return admin || (m.code && m.code.toUpperCase() === code); }).map(function (m) { return m.id; });
    if (admin || ids.length) return { admin: admin, matieres: ids };
    var pc = profParCode(db, code);
    if (!pc) throw err("Code incorrect.");
    return porteeProf(db, pc);
  }
  function exigerMatiere(scope, id) {
    if (scope.matieres.indexOf(id) < 0) throw err("Cette matière n'est pas accessible avec ce code.");
  }
  function exigerAdmin(scope) { if (!scope.admin) throw err("Réservé au code administrateur."); }
  function exigerProf(scope) { if (scope.colleur) throw err("Réservé aux professeurs de la matière."); }
  // « GARCIA Ana » colle les séances notées « GARCIA Ana », « Mme García », « A. Garcia »…
  function familleDe(nom) {
    var mots = str(nom).split(/\s+/), f = [];
    for (var i = 0; i < mots.length; i++) {
      if (/[A-ZÀ-Þ]/.test(mots[i]) && mots[i] === mots[i].toUpperCase()) f.push(mots[i]); else break;
    }
    return normNom(f.length && f.length < mots.length ? f.join(" ") : mots[mots.length - 1] || "").replace(/[^a-z0-9 ]+/g, " ").trim();
  }
  function estColleurDe(nom, texte) {
    var a = normNom(texte), n = normNom(nom);
    if (!a || !n) return false;
    if (a === n) return true;
    var fam = familleDe(nom);
    return !!fam && (" " + a.replace(/[^a-z0-9]+/g, " ") + " ").indexOf(" " + fam + " ") >= 0;
  }

  function journal(db, now, action, o, par) {
    db.ajouter("journal", { le: now.iso, action: action, classe: o.classe || "", matiere: o.matiere || "",
      date: o.date || "", heure: o.heure || "", eleve: o.eleve || "", par: par || "" });
    // L'élève concerné le verra en arrivant sur le site (petit tableau à part : le journal n'est jamais relu côté élève)
    if (action === "Annulée par la gestion" && o.eleve)
      db.ajouter("avis", { le: now.iso, classe: o.classe || "", eleve: o.eleve, matiere: o.matiere || "", date: o.date || "", heure: o.heure || "", type: "", texte: "" });
  }
  // Message affiché à un élève sur sa page d'accueil jusqu'à la date indiquée
  function messageEleve(db, now, classe, eleve, jusquau, texte) {
    db.ajouter("avis", { le: now.iso, classe: classe, eleve: eleve, matiere: "", date: jusquau, heure: "", type: "info", texte: texte });
  }

  // Après une modification du planning : retire les inscriptions futures devenues invalides.
  function purger(db, now, par) {
    var garde = [], retire = 0, change = false;
    db.t("inscriptions").forEach(function (i) {
      if (estPasse(i.date, i.heure, now) || creneauValide(db, i.creneau)) { garde.push(i); return; }
      change = true;
      if (actif(i)) { retire++; journal(db, now, "Annulée par la gestion", i, par); }
    });
    if (change) db.set("inscriptions", garde);
    return retire;
  }

  /* ---------- Demandes de remplacement ---------- */
  // Une demande ne vaut que tant que l'inscription de celui qui la fait existe (et n'est pas commencée)
  function demandeValide(db, x, now) {
    var a = find(db.t("inscriptions"), function (i) { return actif(i) && i.creneau === x.creneau && i.eleve === x.de && i.classe === x.classe; });
    if (!a || estPasse(a.date, a.heure, now)) return null;
    var b = null;
    if (x.contre) {
      b = find(db.t("inscriptions"), function (i) { return actif(i) && i.creneau === x.contre && i.eleve === x.pour && i.classe === x.classe; });
      if (!b || estPasse(b.date, b.heure, now)) return null;

  // Une inscription qui change ou disparaît emporte les demandes qui la concernent

    if (garde.length !== ech.length) db.set("echanges", garde);
  }

  /* ---------- Vue élève ---------- */
  function ressourcesPour(db, ids) {
    var vus = {};
    ids.forEach(function (id) { vus[id] = 1; });
    return db.t("ressources").map(function (r) {
      var ms = str(r.matieres).split(",").filter(function (id) { return vus[id]; });
      return ms.length ? { id: r.id, matiere: ms[0], matieres: ms, titre: r.titre, type: r.type, url: r.url, taille: +r.taille || 0, le: r.le, par: r.par } : null;
    }).filter(Boolean).sort(function (a, b) { return a.le < b.le ? 1 : a.le > b.le ? -1 : 0; });
  }
  function etat(db, p, now) {
    var c = classeAuth(db, p);
    var nom = str(p.eleve);
    var eleves = db.t("eleves").filter(function (e) { return e.classe === c.id; })
      .map(function (e) { return e.nom; }).sort(parNomFr);
    var moi = nom ? find(db.t("eleves"), function (e) { return e.classe === c.id && e.nom === nom; }) : null;
    // Colles passées depuis plus d'une semaine : inutiles ici (la réponse reste légère toute l'année)
    var fin = addDays(now.date, 7 * SEMAINES_AFFICHEES), depuis = addDays(now.date, -7);
    var parCreneau = inscritsParCreneau(db), absParCreneau = absentsParCreneau(db);
    var miennes = moi ? collesDeLeleve(db, c.id, moi.nom, now.date) : [];
    var numeros = {};
    var estMoi = function (i) { return moi && i.eleve === moi.nom && i.classe === c.id; };
    var matsClasse = db.t("matieres").filter(function (m) { return m.classe === c.id; });
    var matieres = matsClasse.map(function (m) {
      var duree = +m.duree || 40, places = placesDe(m);
      var semaines = semainesDe(db, m.id, depuis, fin).map(function (w) {
        numeros[m.id + "|" + w.lundi] = w.num;
        var ouvert = estOuvert(db, m.id, w.lundi, now), mien = null, absence = null, libres = 0, toutFini = true;
        var ss = w.seances.map(function (s) {
          return {
            source: s.source, date: s.date, salle: s.salle, colleur: s.colleur, annule: s.annule, duree: s.duree, places: s.places,
            creneaux: s.heures.map(function (h) {
              var id = idCreneau(s.source, s.date, h), qui = parCreneau[id] || [];
              var aMoi = qui.some(estMoi), absMoi = !aMoi && (absParCreneau[id] || []).some(estMoi);
              var passe = estPasse(s.date, h, now), reste = Math.max(0, s.places - qui.length);
              var etat = s.annule ? "annule" : aMoi ? "moi" : absMoi ? "absent" : passe ? "passe" : reste ? "libre" : "complet";
              var conflit = etat === "libre" ? chevauchement(miennes, m.id, w.lundi, s.date, h, s.duree) : null;
              if (conflit) etat = "conflit";
              if (aMoi) mien = { creneau: id, date: s.date, debut: h };
              if (absMoi) absence = { creneau: id, date: s.date, debut: h };
              if (!s.annule && !passe) { toutFini = false; libres += reste; }
              var cr = { id: id, debut: h, fin: fromMin(toMin(h) + s.duree), places: s.places, restantes: reste, etat: etat,
                       noms: qui.map(function (i) { return i.eleve; }) };
              if (conflit) cr.conflit = messageChevauchement(conflit);
              return cr;
            })
          };
        });
        return {
          num: w.num, lundi: w.lundi, seances: ss, ouvert: ouvert, ouverture: ouverture(db, w.lundi), detail: detailDe(db, m.id, w.lundi),
          termine: toutFini, annulee: ss.every(function (s) { return s.annule; }), libres: ouvert ? libres : 0, moi: mien, absence: mien ? null : absence
        };
      });
      return { id: m.id, nom: m.nom, couleur: m.couleur, info: m.info, duree: duree, places: places, periode: estLibre(m) ? "libre" : semainesParColle(m), semaines: semaines };
    });
    var mes = [], alertes = [], infos = [], demandes = [], mesDemandes = [];

      // Demandes de remplacement : reçues (à accepter) et envoyées (en attente)
      var enAttente = {};
      db.t("echanges").forEach(function (x) {
        if (x.classe !== c.id || (x.pour !== moi.nom && x.de !== moi.nom)) return;
        var v = demandeValide(db, x, now), m = matiereParId(db, x.matiere), cv = v && creneauValide(db, x.creneau);
        if (!v || !m || !cv) return;

                  date: v.a.date, debut: v.a.heure, fin: fromMin(toMin(v.a.heure) + cv.seance.duree), contre: v.b ? { creneau: v.b.creneau, date: v.b.date, debut: v.b.heure } : null };

          debut: i.heure, fin: fromMin(toMin(i.heure) + v.seance.duree), salle: v.seance.salle,
          colleur: v.seance.colleur, info: m.info, lundi: cle, detail: detailDe(db, m.id, cle), passe: estPasse(i.date, i.heure, now),

      mes.sort(function (a, b) { return (a.date + a.debut) < (b.date + b.debut) ? -1 : 1; });
      db.t("avis").forEach(function (j) {
        if (j.classe !== c.id || j.eleve !== moi.nom || j.date < now.date) return;
        if (j.type === "info") { infos.push({ texte: j.texte, le: j.le }); return; }
        var m = matiereParId(db, j.matiere);

      });
    }
    return {
      ok: true, aujourdhui: now.date, maintenant: now.time,
      classe: { id: c.id, nom: c.nom }, eleves: eleves,
      moi: moi ? { nom: moi.nom, aCode: !!moi.pin } : null,
      matieres: matieres, mesColles: mes, alertes: alertes, infos: infos, demandes: demandes, mesDemandes: mesDemandes,
      ressources: ressourcesPour(db, matsClasse.map(function (m) { return m.id; })),
      push: db.reglage("push_public", ""),

  /* ---------- Recherche d'un camarade, toutes classes (lecture seule) ---------- */
  function annuaire(db, p, now) {
    classeAuth(db, p);
    var mats = {};
    db.t("matieres").forEach(function (m) { mats[m.id] = m; });
    var colles = [];
    db.t("inscriptions").forEach(function (i) {
      if (!actif(i) || estPasse(i.date, i.heure, now)) return;
      var m = mats[i.matiere], v = m && creneauValide(db, i.creneau);
      if (!v) return;
      colles.push({ nom: i.eleve, classe: i.classe, matiere: m.nom, couleur: m.couleur, date: i.date, debut: i.heure,
        fin: fromMin(toMin(i.heure) + v.seance.duree), salle: v.seance.salle, colleur: v.seance.colleur });
    });
    colles.sort(function (a, b) { return (a.date + a.debut) < (b.date + b.debut) ? -1 : 1; });
    return {
      ok: true,
      classes: db.t("classes").map(function (c) { return { id: c.id, nom: c.nom }; }),
      eleves: db.t("eleves").map(function (e) { return { nom: e.nom, classe: e.classe }; }),
      colles: colles
    };
  }

  /* ---------- Fichier agenda (.ics) : sans rappel imposé, chacun garde les réglages de son agenda ---------- */
  var LYCEE = "Lycée Sidoine Apollinaire";
  function icsTexte(c) {
    var dt = function (d, t) { return d.replace(/-/g, "") + "T" + t.replace(":", "") + "00"; };
    var x = function (t) { return String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); };
    var titre = "Colle de " + c.matiereNom + (c.num ? " (colle " + c.num + ")" : "");
    var lieu = c.salle ? "Salle " + c.salle + ", " + LYCEE : LYCEE;
    var details = [c.info, c.detail ? "Programme : " + c.detail : "", c.colleur ? "Colleur : " + c.colleur : "", c.url ? "En cas de changement, le Colloscope fait foi : " + c.url : ""].filter(Boolean).join("\n");
    var stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    return [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Colloscope//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
      "BEGIN:VTIMEZONE", "TZID:Europe/Paris",
      "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST", "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
      "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET", "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
      "END:VTIMEZONE",
      "BEGIN:VEVENT",
      "UID:" + String(c.creneau).replace(/[^A-Za-z0-9-]/g, "-") + "@colloscope",
      "DTSTAMP:" + stamp,
      "DTSTART;TZID=Europe/Paris:" + dt(c.date, c.debut),
      "DTEND;TZID=Europe/Paris:" + dt(c.date, c.fin),
      "SUMMARY:" + x(titre), "LOCATION:" + x(lieu), "DESCRIPTION:" + x(details),
      "END:VEVENT", "END:VCALENDAR"

  }
  // Une ligne iCalendar ne doit pas dépasser 75 octets : on la coupe, la suite commence par une espace.
  function plier(ligne) {
    var out = "", n = 0;
    for (var i = 0; i < ligne.length; i++) {
      var ch = ligne.charAt(i), c = ligne.charCodeAt(i), octets = c < 0x80 ? 1 : c < 0x800 ? 2 : (c >= 0xD800 && c <= 0xDBFF) ? 4 : 3;
      if (c >= 0xD800 && c <= 0xDBFF && i + 1 < ligne.length) { ch += ligne.charAt(++i); }
      if (n + octets > 75) { out += "\r\n "; n = 1; }
      out += ch; n += octets;
    }

  }
  function icsCreneau(db, p) {
    var v = creneauValide(db, str(p.c));
    if (!v) throw err("Ce créneau n'existe plus.");
    var m = matiereParId(db, v.matiere);
    if (!m) throw err("Ce créneau n'existe plus.");
    var cle = periodeDe(db, m, v.date);
    return { ok: true, ics: icsTexte({ creneau: str(p.c), matiereNom: m.nom, num: numeroDe(db, m, cle, v.date), date: v.date, debut: v.heure,
      fin: fromMin(toMin(v.heure) + v.seance.duree), salle: v.seance.salle, colleur: v.seance.colleur, info: m.info,
      detail: detailDe(db, m.id, cle), url: str(p.app) }) };
  }

  /* ---------- Consultation d'une autre classe (lecture seule) ---------- */
  function consulter(db, p, now) {
    classeAuth(db, p);
    var cible = find(db.t("classes"), function (x) { return x.id === str(p.cible); });
    if (!cible) throw err("Classe introuvable.");
    var fin = addDays(now.date, 7 * SEMAINES_AFFICHEES), parCreneau = inscritsParCreneau(db);
    var matieres = db.t("matieres").filter(function (m) { return m.classe === cible.id; }).map(function (m) {
      var duree = +m.duree || 40;
      return {
        id: m.id, nom: m.nom, couleur: m.couleur, info: m.info, duree: duree, places: placesDe(m),
        semaines: semainesDe(db, m.id, now.date, fin).map(function (w) {
          var fini = true;
          var ss = w.seances.map(function (s) {
            return { date: s.date, salle: s.salle, colleur: s.colleur, annule: s.annule, duree: s.duree, places: s.places,
              creneaux: s.heures.map(function (h) {
                var passe = estPasse(s.date, h, now);
                if (!passe && !s.annule) fini = false;
                return { debut: h, fin: fromMin(toMin(h) + s.duree), passe: passe,
                  noms: (parCreneau[idCreneau(s.source, s.date, h)] || []).map(function (i) { return i.eleve; }) };
              }) };
          });

            termine: fini, annulee: ss.every(function (s) { return s.annule; }), seances: ss, detail: detailDe(db, m.id, w.lundi) };
        })

  }

  /* ---------- Actions des élèves ---------- */
  function reserver(db, p, now) {
    var a = eleveAuth(db, p), c = a.c, e = a.e;
    var idc = str(p.creneau), v = creneauValide(db, idc);
    if (!v) throw err("Ce créneau n'existe plus. Actualise la page.");
    var m = matiereParId(db, v.matiere);
    if (!m || m.classe !== c.id) throw err("Ce créneau ne concerne pas ta classe.");
    if (estPasse(v.date, v.heure, now)) throw err("Ce créneau est déjà passé.");
    var sem = periodeDe(db, m, v.date), ancienne = null, retour = null;
    if (!estOuvert(db, v.matiere, sem, now)) {
      var o = ouverture(db, sem);
      throw err("Les inscriptions pour cette colle ouvrent le " + o.date.split("-").reverse().join("/") + " à " + o.heure.replace(":", "h") + ".");
    }
    var ins = db.t("inscriptions");
    var deja = inscritsParCreneau(db)[idc] || [];
    if (deja.some(function (i) { return i.eleve === e.nom && i.classe === c.id; })) return { ok: true };
    if (deja.length >= v.seance.places) throw err("Trop tard : ce créneau vient d'être complété.");
    // Une colle par matière et par période (semaine, quinzaine, colle à dates libres) : l'ancienne est remplacée.
    var garde = ins.filter(function (i) {
      if (i.classe !== c.id || i.eleve !== e.nom || i.matiere !== m.id) return true;
      if (i.creneau === idc && !actif(i)) { retour = i; return false; }   // il revient sur ce créneau après avoir signalé une absence
      if (actif(i) && !estPasse(i.date, i.heure, now) && periodeDe(db, m, i.date) === sem) { ancienne = i; return false; }
      return true;
    });
    if (find(garde, function (i) { return actif(i) && i.classe === c.id && i.eleve === e.nom && i.matiere === m.id && periodeDe(db, m, i.date) === sem; }))
      throw err("Tu as déjà passé ta colle " + deMatiere(m.nom) + (estLibre(m) || semainesParColle(m) > 1 ? " pour cette période." : " cette semaine."));
    // Pas deux colles en même temps, même en partie
    var conflit = chevauchement(collesDeLeleve(db, c.id, e.nom, v.date).filter(function (x) { return !ancienne || x.creneau !== ancienne.creneau; }),

    } else if (a === "colleur_code") {

      if (!idsR.length) throw err("Choisis au moins une classe.");
      idsR.forEach(function (id) { exigerMatiere(scope, id); });
      var titreR = str(o.titre).replace(/\s+/g, " ");
      if (!titreR) throw err("Donne un titre au document.");
      if (titreR.length > 120) throw err("Titre trop long (120 caractères au plus).");
      var typeR = str(o.type) === "fichier" ? "fichier" : "lien", urlR = str(o.url);

      var nr = { id: uid("d"), matieres: idsR.join(","), titre: titreR, type: typeR, url: urlR, fichier: typeR === "fichier" ? str(o.fichier) : "",

  /* ---------- Entretien (avant chaque écriture) ---------- */
  // Mise à jour des données d'une version à l'autre (une seule fois)
  function migrer(db, now) {
    if (+db.reglage("version_donnees", "1") >= 2) return;
    // Les colles passées avant cette version (sur papier, ou avant l'arrivée des absences) ne comptent pas comme absences
    if (!db.reglage("absences_depuis", "")) reglageEcrire(db, "absences_depuis", now.date);
    // Le français n'a pas de rythme fixe : colles à dates libres, si rien n'est encore saisi
    var change = false;
    db.t("matieres").forEach(function (m) {
      if (normNom(m.nom) !== "francais" || estLibre(m) || (+m.periode || 1) > 1) return;
      if (db.t("regles").some(function (r) { return r.matiere === m.id; }) || db.t("ponctuels").some(function (x) { return x.matiere === m.id; })) return;
      m.periode = "libre"; change = true;

    if (change) db.touch("matieres");
    reglageEcrire(db, "version_donnees", "2");
  }
  function archiver(db, now) {
    migrer(db, now);

    if (av.some(function (x) { return x.date < now.date; })) db.set("avis", av.filter(function (x) { return x.date >= now.date; }));
    var ech = db.t("echanges");   // demandes devenues sans objet
    if (ech.length) {
      var vivantes = ech.filter(function (x) { return !!demandeValide(db, x, now); });
      if (vivantes.length !== ech.length) db.set("echanges", vivantes);
    }
    var limite = addDays(now.date, -21), ins = db.t("inscriptions");
    var vieilles = ins.filter(function (i) { return i.date < limite; });
    if (vieilles.length < 40) return;
    vieilles.forEach(function (i) { db.ajouter("archives", i); });
    db.set("inscriptions", ins.filter(function (i) { return i.date >= limite; }));
  }

  /* ---------- Notifications : qui prévenir, et de quoi (l'envoi est fait par le serveur) ---------- */
  function abonnesDe(db, classe, eleve, pref) {
    return db.t("abonnements").filter(function (x) { return x.classe === classe && (!eleve || x.eleve === eleve) && x[pref] === "1"; });
  }
  // memo : { annonces: clés des colles déjà annoncées (null au premier passage), evenements: [...] }
  function notifications(store, now, memo) {
    var db = Db(store);
    memo = memo || {};
    var messages = [], ouvertes = [], prochaine = "";
    var fin = addDays(now.date, 7 * SEMAINES_AFFICHEES);
    var parClasse = {};
    function ajouter(abos, contenu, ttl) {
      var texte = JSON.stringify(contenu);
      abos.forEach(function (x) { messages.push({ endpoint: x.endpoint, cle: x.cle, auth: x.auth, eleve: x.eleve, classe: x.classe, texte: texte, ttl: ttl }); });
    }
    // 1. Colles qui viennent d'ouvrir (à l'heure prévue, ou à la main)
    db.t("matieres").forEach(function (m) {
      semainesDe(db, m.id, now.date, fin).forEach(function (w) {
        var vivante = w.seances.some(function (s) { return !s.annule && s.heures.some(function (h) { return !estPasse(s.date, h, now); }); });
        if (!vivante) return;
        var cle = m.id + "|" + w.lundi;
        if (estOuvert(db, m.id, w.lundi, now)) {
          ouvertes.push(cle);
          if (memo.annonces && memo.annonces.indexOf(cle) < 0) (parClasse[m.classe] = parClasse[m.classe] || []).push({ m: m, w: w });
        } else {
          var o = ouverture(db, w.lundi), t = o.date + "T" + o.heure;
          if (!prochaine || t < prochaine) prochaine = t;
        }
      });
    });
    Object.keys(parClasse).forEach(function (cl) {
      var liste = parClasse[cl], un = liste.length === 1 ? liste[0] : null;
      var corps = un ? un.m.nom + ", colle " + un.w.num + " (" + dateFr(un.w.seances[0].date) + ")" : liste.map(function (x) { return x.m.nom + " (colle " + x.w.num + ")"; }).join(", ");
      ajouter(abonnesDe(db, cl, "", "ouvertures"), { title: "Inscriptions ouvertes", body: corps + ". À toi de choisir ton créneau.",
        url: un ? "./#c-" + un.m.id + "-" + un.w.lundi : "./", tag: "ouverture" }, 6 * 3600);
    });
    // 2. Événements : places libérées, demandes de remplacement et réponses
    var dejaPrevenu = {};
    (memo.evenements || []).forEach(function (ev) {
      if (ev.type === "place") {
        var v = creneauValide(db, ev.creneau), m = v && matiereParId(db, v.matiere);
        if (!v || !m || m.classe !== ev.classe || estPasse(v.date, v.heure, now)) return;
        var sem = periodeDe(db, m, v.date);
        if (!estOuvert(db, m.id, sem, now)) return;
        var occ = inscritsParCreneau(db);
        if ((occ[ev.creneau] || []).length >= v.seance.places) return;   // déjà reprise
        var w = find(semainesDe(db, m.id, v.date, fin), function (x) { return x.lundi === sem; });
        if (!w) return;
        // Les horaires de la colle, dans l'ordre (deux séances en parallèle à la même heure comptent pour un seul horaire)
        var moments = [], parMoment = {};
        w.seances.forEach(function (s) {
          if (s.annule) return;
          s.heures.forEach(function (h) {
            var t = s.date + " " + h;
            if (!parMoment[t]) { parMoment[t] = []; moments.push(t); }
            parMoment[t].push(idCreneau(s.source, s.date, h));
          });
        });
        moments.sort();
        var pos = moments.indexOf(v.date + " " + v.heure);

        for (var k = pos + 1; k <= pos + 3 && k < moments.length; k++) {

            (occ[idc] || []).forEach(function (i) {
              if (i.classe !== ev.classe || i.eleve === ev.eleve) return;
              var cleP = i.eleve + "|" + ev.creneau;
              if (dejaPrevenu[cleP]) return;
              var x = lireCreneau(i.creneau);
              if (estPasse(x.date, x.heure, now)) return;
              var autres = collesDeLeleve(db, i.classe, i.eleve, v.date).filter(function (y) { return y.creneau !== i.creneau; });
              if (chevauchement(autres, m.id, sem, v.date, v.heure, v.seance.duree)) return;
              dejaPrevenu[cleP] = 1;
              ajouter(abonnesDe(db, i.classe, i.eleve, "places"), { title: "Place libérée en " + m.nom,
                body: cap(dateFr(v.date)) + " à " + heureFr(v.heure) + ", avant ton créneau de " + heureFr(x.heure) + (x.date !== v.date ? " (" + dateFr(x.date) + ")" : "") + ". Touche pour la prendre.",
                url: "./#c-" + m.id + "-" + sem, tag: "place-" + m.id }, 3600);
            });

          body: ev.de + (ev.contre ? " te propose d'échanger vos colles " + deMatiere(md.nom) + " : tu passerais le " : " te propose sa colle " + deMatiere(md.nom) + " du ") + dateFr(cr.date) + " à " + heureFr(cr.heure) + ".",
          url: "./", tag: "demande-" + ev.creneau }, 12 * 3600);
      } else if (ev.type === "essai") {
        var abosE = db.t("abonnements").filter(function (x) { return x.classe === ev.classe && x.eleve === ev.eleve; });
        ajouter(abosE, { title: "Notifications activées", body: "C'est bon : le Colloscope pourra te prévenir sur cet appareil.", url: "./", tag: "essai" }, 600);
      } else if (ev.type === "reponse") {
        var mr = matiereParId(db, ev.matiere), c2 = lireCreneau(ev.creneau);
        if (!mr || !c2) return;
        ajouter(abonnesDe(db, ev.classe, ev.eleve, "echanges"), { title: ev.accepte ? "Proposition acceptée" : "Proposition refusée",
          body: ev.de + (ev.accepte ? " a accepté ta proposition pour ta colle " : " a refusé ta proposition pour ta colle ") + deMatiere(mr.nom) + " du " + dateFr(c2.date) + ".",
          url: "./", tag: "reponse-" + ev.creneau }, 12 * 3600);

  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  // Appareils qui n'existent plus (désinstallés, notifications coupées) : retirés de la liste
  function retirerAbonnements(store, endpoints) {
    var db = Db(store), rows = db.t("abonnements");
    var garde = rows.filter(function (x) { return endpoints.indexOf(x.endpoint) < 0; });
    if (garde.length !== rows.length) { db.set("abonnements", garde); db.commit(); }
    return rows.length - garde.length;
  }
  // Clé publique des notifications (créée par le serveur à l'installation)
  function enregistrerClePush(store, cle) {
    var db = Db(store);

    db.commit();
  }

  // Le code de gestion est-il bon ? (lecture seule : sert au serveur avant de déposer un fichier)
  function autorisationGestion(store, p, now) {
    var lecture = { load: store.load, loadTail: store.loadTail, save: function () {}, append: function () {} };
    try { gestionAuth(Db(lecture), p, now); return true; } catch (e) { if (e && e.utilisateur) return false; throw e; }
  }

  /* ---------- Point d'entrée unique ---------- */
  var AVEC_ENTRETIEN = { reserver: 1, annuler: 1, gestion: 1, absence: 1, remplacement: 1, remplacement_annuler: 1, remplacement_reponse: 1 };
  var RENVOIE_ETAT = { reserver: 1, annuler: 1, absence: 1, remplacement: 1, remplacement_annuler: 1, remplacement_reponse: 1 };
  function traiter(store, p, now) {
    var db = Db(store);
    p = p && typeof p === "object" ? p : {};
    try {
      var r, action = str(p.action);
      if (AVEC_ENTRETIEN[action]) archiver(db, now);
      switch (action) {
        case "classes": verifierAcces(db, p); r = { ok: true, classes: db.t("classes").map(function (c) { return { id: c.id, nom: c.nom }; }), profs: db.t("profs").length > 0 }; break;
        case "professeurs":
          verifierAcces(db, p);
          r = { ok: true, noms: db.t("profs").map(function (x) { return x.nom; }).sort(parNomFr),
                colleurs: db.t("profs").filter(function (x) { return x.role === "colleur"; }).map(function (x) { return x.nom; }) };
          break;
        case "prof_entrer": r = profEntrer(db, p, now); break;
        case "prof_choisir_code": r = choisirCodeProf(db, p, now); break;
        case "etat": r = etat(db, p, now); break;
        case "consulter": r = consulter(db, p, now); break;
        case "annuaire": r = annuaire(db, p, now); break;
        case "ics": r = icsCreneau(db, p); break;
        case "verifier": r = verifierCode(db, p); break;
        case "reserver": r = reserver(db, p, now); break;
        case "annuler": r = annuler(db, p, now); break;
        case "absence": r = absenceEleve(db, p, now); break;
        case "remplacement": r = demanderRemplacement(db, p, now); break;
        case "remplacement_annuler": r = annulerDemande(db, p); break;
        case "remplacement_reponse": r = repondreDemande(db, p, now); break;

function plage(a, b) { return h(a) + " – " + h(b); }
function joindre(arr) { return arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " et " + arr[arr.length - 1]; }
// « 5 et 8 oct. », « 29 sept. et 2 oct. »
function listeDates(dates) {
  var u = dates.filter(function (d, i) { return dates.indexOf(d) === i; });
  return joindre(u.map(function (d, i) {
    var dernier = i === u.length - 1 || moisDe(u[i + 1]) !== moisDe(d);

  }));
}

/* ---------- Heure de Paris ---------- */
function maintenant() {
  var f = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  var p = {}; f.formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return { date: p.year + "-" + p.month + "-" + p.day, time: p.hour + ":" + p.minute, iso: p.year + "-" + p.month + "-" + p.day + "T" + p.hour + ":" + p.minute + ":" + p.second };
}

/* ---------- Serveur (ou démonstration locale) ---------- */
var CLE_DEMO = "colloscope-demo-v9";
var demo = null;
function demoData() { if (!demo) demo = LS.get(CLE_DEMO) || COLLES.depart(); return demo; }
var demoStore = {
  load: function (n) { return JSON.parse(JSON.stringify(demoData()[n] || [])); },
  append: function (n, rows) { demoData()[n] = (demoData()[n] || []).concat(JSON.parse(JSON.stringify(rows))); LS.set(CLE_DEMO, demo); },
  save: function (n, rows) { demoData()[n] = JSON.parse(JSON.stringify(rows)); LS.set(CLE_DEMO, demo); }
};
function api(p) {
  if (DEMO) {
    return new Promise(function (ok) {
      setTimeout(function () {
        try { ok(COLLES.traiter(demoStore, JSON.parse(JSON.stringify(p)), maintenant())); }
        catch (e) { console.error(e); ok({ ok: false, error: "Erreur inattendue." }); }
      }, 140);
    });
  }
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, p.data && p.data.contenu ? 120000 : 40000);
  return fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(p), signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, error: "Connexion impossible. Vérifie ta connexion internet et réessaie." }; })
    .finally(function () { clearTimeout(t); });
}

  if (dernierFocus && document.body.contains(dernierFocus)) try { dernierFocus.focus({ preventScroll: true }); } catch (e) {}
}
function enAttente(btn, texte) { btn.disabled = true; btn.dataset.txt = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>' + esc(texte || btn.textContent); }
function finAttente(btn) { if (btn && btn.dataset.txt) { btn.innerHTML = btn.dataset.txt; btn.disabled = false; } }
function chargement() { return '<div class="chargement" aria-label="Chargement"><i></i><i></i><i></i></div>'; }

function monogramme() { return '<img class="monogramme" src="' + LOGO + '" alt="" width="56" height="56">'; }
// En-tête : marque ou retour à gauche, actions à droite
function tete(o) {
  o = o || {};
  var g = o.retour
    ? '<button class="retour" data-act="' + (o.retourH !== undefined ? "aller" : (o.retourAct || "retour")) + '"' + (o.retourH !== undefined ? ' data-h="' + esc(o.retourH) + '"' : '') + '>' + ICON.retour + '<span>' + esc(o.retour) + '</span></button>'
    : '<div class="marque">' + monogramme() + '<span class="nom">Colloscope</span>' + (o.sous ? '<span class="sous">' + esc(o.sous) + '</span>' : '') + '</div>';
  var d = "";
  if (o.maj) d += '<button class="icone' + (S.maj ? " tourne" : "") + '" data-act="' + o.maj + '" aria-label="Actualiser">' + ICON.maj + '</button>';
  if (o.profil) d += '<button class="initiales" data-act="profil" aria-label="Mon profil et mes notifications">' + esc(initiales(o.profil)) + '</button>';
  return '<header class="tete">' + g + d + '</header>';
}
function avis(type, html, extra) {
  return '<div class="avis ' + (type || "") + '" role="' + (type === "attention" ? "status" : "note") + '">' + (type === "attention" ? ICON.attention : ICON.info) + '<span>' + html + '</span>' + (extra || "") + '</div>';
}
var TEXTE_DEMO = '<b>Démonstration.</b> Les données restent sur cet appareil. Code d\'accès <code>PREPA</code>. Professeure : MARTIN Claire, code <code>PROF2026</code> ; colleuse : GARCIA Ana, code <code>COLLE2026</code>. Codes de gestion <code>eco</code>, <code>droit</code>… ou <code>admin</code>.';
function bandeauDemo() { return DEMO ? '<p class="demo">' + TEXTE_DEMO + '</p>' : ""; }
function piedPage() {
  return (DEMO ? '<p class="note" style="margin-top:40px">' + TEXTE_DEMO + '</p>' : '') +
    '<footer class="pied"' + (DEMO ? ' style="margin-top:16px"' : '') + '><span>' + esc(CONFIG.LYCEE) + '</span><button data-act="aller-gestion">Espace gestion</button>' +
    (DEMO ? '<button data-act="demo-reset">Réinitialiser la démo</button>' : '') + '</footer>';

function feuilleFormulaire(o) {
  var champs = o.champs.map(function (c) {
    var id = "f-" + c.id, v = c.valeur == null ? "" : c.valeur, input;
    if (c.type === "select") {
      input = '<select class="entree" id="' + id + '">' + c.options.map(function (op) {
        return '<option value="' + esc(op[0]) + '"' + (String(op[0]) === String(v) ? " selected" : "") + '>' + esc(op[1]) + '</option>';
      }).join("") + '</select>';
    } else if (c.type === "textarea") {
      input = '<textarea class="entree" id="' + id + '" placeholder="' + esc(c.placeholder || "") + '"' + (c.attrs || "") + '>' + esc(v) + '</textarea>';
    } else {
      input = '<input class="entree" id="' + id + '" type="' + (c.type || "text") + '" value="' + esc(v) + '" placeholder="' + esc(c.placeholder || "") + '"' + (c.attrs || "") + '>';
    }
    return '<label class="champ" for="' + id + '"><span>' + esc(c.label) + '</span>' + (c.aide ? '<small>' + esc(c.aide) + '</small>' : '') + input + '</label>';
  }).join("");
  ouvrirFeuille('<h3>' + esc(o.titre) + '</h3>' + (o.intro ? '<p class="note" style="font-size:14px;color:var(--encre-2)">' + o.intro + '</p>' : '') +
    '<form id="ff" class="formulaire" novalidate>' + champs + '<div class="erreur" id="ff-err" role="alert"></div>' +
    '<div class="actions" id="ff-actions"><button type="button" class="btn discret" data-act="fermer">Annuler</button>' +
    '<button type="submit" class="btn primaire" id="ff-ok">' + esc(o.bouton || "Enregistrer") + '</button></div></form>', o.titre);
  $("#ff").addEventListener("submit", function (e) {
    e.preventDefault();
    var vals = {};
    o.champs.forEach(function (c) { vals[c.id] = $("#f-" + c.id).value.trim(); });
    var btn = $("#ff-ok"); enAttente(btn);
    Promise.resolve(o.envoyer(vals)).then(function (r) {
      if (r && r.ok === false) { $("#ff-err").textContent = r.error; finAttente(btn); }
    });
  });
}
function feuilleConfirmer(titre, corps, bouton, danger, action) {
  ouvrirFeuille('<h3>' + esc(titre) + '</h3>' + corps + '<div class="erreur" id="fc-err" role="alert"></div>' +
    '<div class="pied-feuille"><button class="btn plein ' + (danger ? "danger" : "primaire") + '" id="fc-ok">' + esc(bouton) + '</button>' +
    '<button class="btn plein discret" data-act="fermer">Retour</button></div>', titre);
  $("#fc-ok").onclick = function () {
    var b = this; enAttente(b);
    Promise.resolve(action()).then(function (r) {
      if (r && r.ok === false) { $("#fc-err").textContent = r.error; finAttente(b); }
    });
  };
}

/* ---------- Agenda ---------- */
var URL_SITE = location.href.split("#")[0];
function lieuDe(c) { return c.salle ? "Salle " + c.salle + ", " + CONFIG.LYCEE : CONFIG.LYCEE; }
function titreEv(c) { return "Colle de " + c.matiereNom + (c.num ? " (colle " + c.num + ")" : ""); }
function icsTexte(c) { return COLLES.icsTexte(Object.assign({ url: URL_SITE }, c)); }
function telechargerIcs(c) {
  if (DEMO) { toast("L'aperçu bloque les téléchargements. Ça marchera sur le vrai site.", false); return; }
  var url = URL.createObjectURL(new Blob([icsTexte(c)], { type: "text/calendar;charset=utf-8" }));
  var a = document.createElement("a");
  a.href = url; a.download = "colle-" + c.matiereNom.toLowerCase().normalize("NFD").replace(/[^a-z]/g, "") + "-" + c.date + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
function lienGoogle(c) {
  var dt = function (d, t) { return d.replace(/-/g, "") + "T" + t.replace(":", "") + "00"; };
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(titreEv(c)) +
    "&dates=" + dt(c.date, c.debut) + "/" + dt(c.date, c.fin) + "&ctz=Europe/Paris&location=" + encodeURIComponent(lieuDe(c)) +
    "&details=" + encodeURIComponent([c.info, c.detail ? "Programme : " + c.detail : "", URL_SITE].filter(Boolean).join("\n"));
}
function feuilleAgenda(c) {
  ouvrirFeuille('<h3>Ajouter à mon agenda</h3><div class="resume"><span class="muet">' + esc(titreEv(c)) + ', ' + esc(dateLongue(c.date)) + ' à ' + hc(c.debut) + '</span></div>' +
    '<div class="choix">' +
    '<button class="ligne" data-act="ag-fichier" data-c="' + esc(c.creneau) + '">' + ICON.agenda + '<span class="corps"><span class="principal">Calendrier du téléphone</span><span class="secondaire">iPhone, Samsung et la plupart des agendas</span></span></button>' +
    '<a class="ligne" href="' + esc(lienGoogle(c)) + '" target="_blank" rel="noopener" data-act="fermer">' + ICON.externe + '<span class="corps"><span class="principal">Google Agenda</span><span class="secondaire">S\'ouvre dans un nouvel onglet</span></span></a>' +
    '</div><p class="note">Si ta colle change, pense à mettre ton agenda à jour.</p>' +
    '<button class="btn plein discret" data-act="fermer">Fermer</button>', "Ajouter à mon agenda");

/* =====================================================================
   Connexion : code d'accès (une fois), classe, nom, code personnel
   ===================================================================== */
function vueArrivee() {
  var ob = S.ob, html = '';

      '<div class="erreur" id="err" role="alert">' + esc(ob.erreur || "") + '</div><button class="btn primaire plein" id="ok">Continuer</button></form></div>' + piedPage();

      return '<button class="ligne" data-act="classe" data-id="' + esc(c.id) + '"><span class="corps"><span class="principal">' + esc(c.nom) + '</span></span>' + ICON.chev + '</button>';
    }).join("") + (ob.profs ? '<button class="ligne" data-act="ob-profs"><span class="corps"><span class="principal">Professeurs et colleurs</span><span class="secondaire">Gestion de vos colles</span></span>' + ICON.chev + '</button>' : '') + '</div>';
    html += '</div></div>' + piedPage();
  } else if (ob.etape === "prof-nom") {
    var colleurs = ob.colleurs || [];
    html += tete({ retour: "Classes", retourAct: "ob-retour" }) + '<div class="titre"><h1>Professeurs et colleurs</h1><p>Choisissez votre nom.</p></div>' +
      '<div class="section"><div class="liste">' + (ob.profsNoms.length ? ob.profsNoms.map(function (n) {
        return '<button class="ligne" data-act="prof-nom" data-nom="' + esc(n) + '"><span class="corps"><span class="principal">' + esc(n) + '</span></span>' +
          (colleurs.indexOf(n) >= 0 ? '<span class="tag">colleur</span>' : '') + ICON.chev + '</button>';
      }).join("") : '<div class="vide">La liste des professeurs n\'a pas encore été ajoutée.</div>') + '</div></div>';
  } else if (ob.etape === "prof-code") {
    html += tete({ retour: "Changer de nom", retourAct: "ob-retour" }) + '<form class="formulaire" id="f-prof" style="margin-top:28px">' +
      '<div class="titre" style="padding:0"><h1>Bonjour</h1><p>' + esc(ob.prof) + '. Entrez votre code personnel : celui que vous avez choisi, ou celui donné par l\'administrateur du Colloscope. Il ne sera plus demandé sur cet appareil.</p></div>' +
      '<label class="champ" for="pcode"><span>Code personnel</span><input class="entree" id="pcode" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" required></label>' +
      '<div class="erreur" id="err" role="alert"></div><button class="btn primaire plein" id="ok">Entrer</button>' + bandeauDemo() + '</form>';
  } else if (ob.etape === "prof-nouveau") {
    html += tete() + '<form class="formulaire" id="f-nouveau" style="margin-top:28px" novalidate>' +
      '<div class="titre" style="padding:0"><h1>Votre code</h1><p>Remplacez le code donné par l\'administrateur par un code facile à retenir. Il sera demandé avec votre nom sur un nouvel appareil.</p></div>' +
      '<label class="champ" for="ncode"><span>Nouveau code</span><small>6 lettres ou chiffres au moins, sans espace. Notez-le quelque part.</small><input class="entree" id="ncode" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" required></label>' +
      '<div class="erreur" id="err" role="alert"></div><button class="btn primaire plein" id="ok">Enregistrer mon code</button>' +
      '<button type="button" class="btn plein discret" data-act="prof-plus-tard">Plus tard</button></form>';
  } else if (ob.etape === "nom") {
    html += tete({ retour: "Classes", retourAct: "ob-retour" }) + '<div class="titre"><h1>Qui es-tu ?</h1><p>' + esc(ob.classe.nom) + '. Choisis ton nom dans la liste.</p></div>' +

  } else if (ob.etape === "pin") {

    html += tete({ retour: "Changer de nom", retourAct: "ob-retour" }) + '<form class="formulaire" id="f-pin" style="margin-top:28px">' +
      '<div class="titre" style="padding:0"><h1>' + (nouveau ? "Bonjour " + esc(prenom(ob.eleve)) : "Bon retour, " + esc(prenom(ob.eleve))) + '</h1><p>' +
