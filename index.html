<body>
<style>
/* Direction : outil officiel du lycée, finition de logiciel. Une colonne, des listes à séparateurs fins,
   le bleu du lycée réservé à ce qui compte (inscription, action principale, marque). */
:root {
  --bleu: #145ff6;        /* bleu du logo du lycée (bas du dégradé) */
  --bleu-fort: #0f4fd6;
  --bleu-ciel: #00c8ff;   /* haut du dégradé du logo */
  --bleu-pale: #eef3fd;
  --fond: #f7f8fa;
  --surface: #ffffff;
  --survol: #f3f5f8;
  --trait: #e6e9ee;
  --trait-fort: #d2d7df;
  --encre: #101828;
  --encre-2: #475467;
  --discret: #8a94a6;
  --ambre: #b54708;
  --rouge: #c0362c;
  --vert: #067647;
  --voile: rgba(16, 24, 40, .32);
  --ombre: 0 1px 2px rgba(16, 24, 40, .05), 0 12px 32px -8px rgba(16, 24, 40, .18);
  --f: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r-s: 6px; --r: 10px; --r-l: 14px;
  --h: 40px;
  --t: 160ms cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bleu: #5b8ff5; --bleu-fort: #7aa6ff; --bleu-pale: #15213b;
    --fond: #0c0f14; --surface: #12161d; --survol: #181d26; --trait: #222935; --trait-fort: #2e3644;
    --encre: #e8ecf2; --encre-2: #a7b0bf; --discret: #6b7484;
    --ambre: #f0a35c; --rouge: #f07b70; --vert: #4cc38a; --voile: rgba(0, 0, 0, .55);
    --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -8px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bleu: #5b8ff5; --bleu-fort: #7aa6ff; --bleu-pale: #15213b;
  --fond: #0c0f14; --surface: #12161d; --survol: #181d26; --trait: #222935; --trait-fort: #2e3644;
  --encre: #e8ecf2; --encre-2: #a7b0bf; --discret: #6b7484;
  --ambre: #f0a35c; --rouge: #f07b70; --vert: #4cc38a; --voile: rgba(0, 0, 0, .55);
  --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -8px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font: 400 15px/1.5 var(--f); font-feature-settings: "tnum" 0;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; border-radius: var(--r-s); }
.chiffres { font-variant-numeric: tabular-nums; }
.app { max-width: 600px; margin: 0 auto; padding-inline: 20px; padding-block: 0 56px; }

/* ---------- Signature : liseré bleu du lycée en haut de l'écran ---------- */
body::before {
  content: ""; position: fixed; z-index: 30; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px;
  background: linear-gradient(90deg, var(--bleu-ciel), var(--bleu)); pointer-events: none;
}

/* ---------- En-tête ---------- */
.tete {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: -20px; padding: 0 12px 0 20px; height: 56px;
  display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--fond) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid transparent; transition: border-color var(--t);
}
.tete.defile { border-bottom-color: var(--trait); }
.marque { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.monogramme { width: 28px; height: 28px; flex: none; display: block; }
.marque .nom { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.marque .sous { color: var(--discret); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.retour { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 8px 0 2px; margin-left: -6px; border-radius: var(--r-s); color: var(--encre-2); font-weight: 500; font-size: 14px; flex: 1; min-width: 0; }
.retour svg { width: 18px; height: 18px; flex: none; }
.retour:hover { color: var(--encre); }
.icone { width: 36px; height: 36px; border-radius: var(--r-s); display: grid; place-items: center; color: var(--encre-2); flex: none; transition: background var(--t), color var(--t); }
.icone:hover { background: var(--survol); color: var(--encre); }
.icone svg { width: 18px; height: 18px; }
.icone.tourne svg { animation: tourne .6s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.initiales { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--trait-fort); font-size: 11px; font-weight: 600; color: var(--encre-2); display: grid; place-items: center; flex: none; transition: border-color var(--t); }
.initiales:hover { border-color: var(--encre-2); color: var(--encre); }

/* ---------- Titres de page ---------- */
.titre { padding-top: 28px; display: grid; gap: 4px; }
.titre h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -.022em; text-wrap: balance; }
.titre p { margin: 0; color: var(--encre-2); font-size: 15px; }
.section { margin-top: 36px; display: grid; gap: 10px; }
.section h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--encre-2); }
.section .tete-section { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.note { margin: 0; color: var(--discret); font-size: 13px; line-height: 1.5; }

/* Sélecteur de matière : le titre de la page est le menu */
.selecteur { position: relative; display: inline-flex; align-items: center; max-width: calc(100% + 8px); margin-left: -8px; justify-self: start; }
.selecteur select {
  appearance: none; -webkit-appearance: none; border: 0; background: transparent; cursor: pointer;
  font-size: 28px; font-weight: 600; letter-spacing: -.022em; line-height: 1.2;
  padding: 2px 34px 2px 8px; border-radius: var(--r); max-width: 100%; text-overflow: ellipsis;
  transition: background var(--t);
}
.selecteur select:hover { background: var(--survol); }
.selecteur select:focus-visible { outline: 2px solid var(--bleu); outline-offset: 0; }
.selecteur svg { position: absolute; right: 10px; width: 18px; height: 18px; color: var(--discret); pointer-events: none; }
.pastille { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--c, var(--discret)); }

/* ---------- Listes ---------- */
.liste { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-l); overflow: hidden; }
.liste > * + * { border-top: 1px solid var(--trait); }
.ligne {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 12px 16px; text-align: left;
  transition: background var(--t);
}
button.ligne:hover, a.ligne:hover { background: var(--survol); }
button.ligne:active { background: var(--trait); }
.ligne .corps { flex: 1; min-width: 0; display: grid; gap: 1px; }
.ligne .principal { font-weight: 500; }
.ligne .secondaire { color: var(--discret); font-size: 13px; }
.ligne .droite { text-align: right; font-size: 14px; color: var(--encre-2); white-space: nowrap; }
.ligne .chev { width: 16px; height: 16px; color: var(--trait-fort); flex: none; margin-right: -4px; }
.ligne.courante .principal { font-weight: 600; }

var COLLES = (function () {

  /* ---------- Calendrier scolaire (zone A, académie de Clermont-Ferrand) ---------- */
  // Dates incluses. Aucune séance générée par une règle ces jours-là.
  var FERME = [
    ["2026-10-17", "2026-11-01", "Vacances de la Toussaint"],
    ["2026-11-11", "2026-11-11", "Armistice"],

  /* ---------- Génération des séances et créneaux ---------- */

  /* ---------- Vue élève ---------- */

      .map(function (e) { return e.nom; }).sort(function (a, b) { return a.localeCompare(b, "fr"); });

    var fin = addDays(now.date, 7 * SEMAINES_AFFICHEES);

  /* ---------- Recherche d'un camarade, toutes classes (lecture seule) ---------- */

    db.t("inscriptions").forEach(function (i) {
      if (estPasse(i.date, i.heure, now)) return;
      var m = mats[i.matiere], v = m && creneauValide(db, i.creneau);
      if (!v) return;

        fin: fromMin(toMin(i.heure) + (+m.duree || 40)), salle: v.seance.salle, colleur: v.seance.colleur });
    });
    colles.sort(function (a, b) { return (a.date + a.debut) < (b.date + b.debut) ? -1 : 1; });

  /* ---------- Fichier agenda (.ics), servi par une vraie adresse pour l'iPhone ---------- */

    if (!v) throw err("Ce créneau n'existe plus. Actualise la page.");
    var m = find(db.t("matieres"), function (x) { return x.id === v.matiere; });
    if (!m || m.classe !== c.id) throw err("Ce créneau ne concerne pas ta classe.");
    if (estPasse(v.date, v.heure, now)) throw err("Ce créneau est déjà passé.");

    var ins = db.t("inscriptions");
    var deja = ins.filter(function (i) { return i.creneau === idc; });
    if (deja.some(function (i) { return i.eleve === e.nom && i.classe === c.id; })) return { ok: true };
    if (deja.length >= placesDe(m)) throw err("Trop tard : ce créneau vient d'être complété.");
    // Une colle par matière et par semaine : l'ancienne est remplacée.
    var sem = lundi(v.date), ancienne = null;
    var garde = ins.filter(function (i) {
      var meme = i.classe === c.id && i.eleve === e.nom && i.matiere === m.id && lundi(i.date) === sem;
      if (meme && !estPasse(i.date, i.heure, now)) { ancienne = i; return false; }
      return true;
    });
    if (find(garde, function (i) { return i.classe === c.id && i.eleve === e.nom && i.matiere === m.id && lundi(i.date) === sem; }))
      throw err("Tu as déjà passé ta colle de " + m.nom + " cette semaine.");
    garde.push({ creneau: idc, matiere: m.id, date: v.date, heure: v.heure, classe: c.id, eleve: e.nom, le: now.iso });
    db.set("inscriptions", garde);
    journal(db, now, ancienne ? "Modification" : "Inscription",
      { classe: c.id, matiere: m.id, date: v.date, heure: v.heure, eleve: e.nom }, ancienne ? "avant : " + ancienne.date + " " + ancienne.heure : "");
    return { ok: true, remplace: ancienne ? { date: ancienne.date, heure: ancienne.heure } : null };
  }

  function annuler(db, p, now) {
    var c = classeAuth(db, p), e = eleveDe(db, c.id, p.eleve);
    verifierPin(db, c.id, e, p.pin);
    var ins = db.t("inscriptions");
    var idc = str(p.creneau);
    var i = find(ins, function (x) { return x.creneau === idc && x.eleve === e.nom && x.classe === c.id; });
    if (!i) throw err("Inscription introuvable.");
    if (estPasse(i.date, i.heure, now)) throw err("Cette colle est déjà passée.");
    db.set("inscriptions", ins.filter(function (x) { return x !== i; }));
    journal(db, now, "Désinscription", i, "");
    return { ok: true };
  }

  function verifierCode(db, p) {
    var c = classeAuth(db, p), e = eleveDe(db, c.id, p.eleve);
    verifierPin(db, c.id, e, p.pin);
    return { ok: true };
  }

  /* ---------- Gestion (professeurs, délégués) ---------- */
  function vueGestion(db, p, now) {
    var scope = gestionAuth(db, p);
    var dans = function (x) { return scope.matieres.indexOf(x.matiere) >= 0; };
    var parCreneau = inscritsParCreneau(db);
    var fin = addDays(now.date, 7 * SEMAINES_AFFICHEES);
    var classes = db.t("classes").map(function (c) {
      return scope.admin ? { id: c.id, nom: c.nom, code: c.code } : { id: c.id, nom: c.nom };
    });
    var matieres = db.t("matieres").filter(function (m) { return scope.matieres.indexOf(m.id) >= 0; }).map(function (m) {
      var duree = +m.duree || 40;
      var tous = db.t("eleves").filter(function (e) { return e.classe === m.classe; }).map(function (e) { return e.nom; });
      return {
        id: m.id, classe: m.classe, nom: m.nom, couleur: m.couleur, duree: duree, places: placesDe(m), info: m.info,
        code: scope.admin ? m.code : undefined,
        semaines: semainesDe(db, m.id, addDays(now.date, -7), fin).map(function (w) {
          var inscrits = {};
          var ss = w.seances.map(function (s) {
            return { source: s.source, type: s.type, date: s.date, salle: s.salle, colleur: s.colleur, annule: s.annule,
              creneaux: s.heures.map(function (h) {
                var id = idCreneau(s.source, s.date, h);
                var noms = (parCreneau[id] || []).map(function (i) { inscrits[i.eleve] = 1; return i.eleve; });
                return { id: id, debut: h, fin: fromMin(toMin(h) + duree), eleves: noms };
              }) };
          });
          return { num: w.num, lundi: w.lundi, ouverture: ouverture(db, w.lundi), ouvert: estOuvert(db, m.id, w.lundi, now),
            aLaMain: ouverteALaMain(db, m.id, w.lundi), termine: ss.every(function (s) { return s.annule || s.creneaux.every(function (c) { return estPasse(s.date, c.debut, now); }); }), seances: ss,
            manquants: ss.every(function (s) { return s.annule; }) ? [] : tous.filter(function (n) { return !inscrits[n]; }).sort(function (a, b) { return a.localeCompare(b, "fr"); }) };
        })
      };
    });
    var out = {
      ok: true, admin: scope.admin, aujourdhui: now.date, classes: classes, matieres: matieres,
      regles: db.t("regles").filter(dans), ponctuels: db.t("ponctuels").filter(dans),
      journal: db.fin("journal", 2000).filter(function (j) { return scope.admin || scope.matieres.indexOf(j.matiere) >= 0; }).slice(-200).reverse()
    };
    if (scope.admin) {
      out.eleves = db.t("eleves").map(function (e) {
        return { classe: e.classe, nom: e.nom, aCode: !!e.pin, bloque: +e.echecs >= MAX_ECHECS };
      });
      out.fermetures = db.fermetures().map(function (f) { return { debut: f[0], fin: f[1], motif: f[2] }; });
      out.reglages = { code_acces: db.reglage("code_acces", ""), ouverture_jours: db.reglage("ouverture_jours", "14"), ouverture_heure: db.reglage("ouverture_heure", "12:00"), debut_annee: db.reglage("debut_annee", "2026-09-01") };
    }
    return out;
  }

  function validerSource(o, avecJour) {
    var h = parseHeures(o.heures);
    if (h.invalides.length) throw err("Heure non reconnue : « " + h.invalides[0] + " ». Exemple : 12h, 12h20, 16h.");
    if (!h.heures.length) throw err("Indique au moins une heure de passage.");
    if (avecJour) {
      if (!(+o.jour >= 1 && +o.jour <= 6)) throw err("Choisis un jour de la semaine.");
      if (!isDate(o.debut)) throw err("Date de début invalide.");
      if (o.fin && !isDate(o.fin)) throw err("Date de fin invalide.");
      if (o.fin && o.fin < o.debut) throw err("La date de fin est avant la date de début.");
      if ([1, 2, 3, 4].indexOf(+o.frequence) < 0) throw err("Fréquence invalide.");
    } else if (!isDate(o.date)) throw err("Date invalide.");
    return h.heures.join(", ");
  }

  function upsert(db, table, row, cols) {
    var rows = db.t(table);
    var ex = row.id ? find(rows, function (x) { return x.id === row.id; }) : null;
    if (!ex) { ex = { id: uid(table.charAt(0)) }; cols.forEach(function (k) { if (k !== "id") ex[k] = ""; }); rows.push(ex); }
    cols.forEach(function (k) { if (k !== "id" && row[k] !== undefined) ex[k] = str(row[k]); });
    db.touch(table);
    return ex;
  }

  function gestion(db, p, now) {
    var scope = gestionAuth(db, p), par = scope.admin ? "admin" : "gestion";
    var a = str(p.op), o = p.data || {};
    var res = { ok: true };

    if (a === "regle") {
      var exR = o.id ? find(db.t("regles"), function (x) { return x.id === o.id; }) : null;
      if (exR) exigerMatiere(scope, exR.matiere);
      exigerMatiere(scope, str(o.matiere));
      o.heures = validerSource(o, true);
      res.id = upsert(db, "regles", o, TABLES.regles).id;
    } else if (a === "regle_suppr" || a === "ponctuel_suppr") {
      var table = a === "regle_suppr" ? "regles" : "ponctuels";
      var r = find(db.t(table), function (x) { return x.id === str(o.id); });
      if (!r) throw err("Élément introuvable.");
      exigerMatiere(scope, r.matiere);
      db.set(table, db.t(table).filter(function (x) { return x !== r; }));
      db.set("annulations", db.t("annulations").filter(function (x) { return x.source !== r.id; }));
    } else if (a === "ponctuel") {
      var exP = o.id ? find(db.t("ponctuels"), function (x) { return x.id === o.id; }) : null;
      if (exP) exigerMatiere(scope, exP.matiere);
      exigerMatiere(scope, str(o.matiere));
      o.heures = validerSource(o, false);
      res.id = upsert(db, "ponctuels", o, TABLES.ponctuels).id;
    } else if (a === "annulation") {
      var m = matiereDeSource(db, str(o.source));
      if (!m) throw err("Séance introuvable.");
      exigerMatiere(scope, m);
      var ann = db.t("annulations");
      if (!isDate(str(o.date))) throw err("Date invalide.");
      var ex = find(ann, function (x) { return x.source === str(o.source) && x.date === str(o.date); });
      if (o.annuler) {
        if (!ex) ann.push({ source: str(o.source), date: str(o.date), motif: str(o.motif) });
        else ex.motif = str(o.motif);
      } else if (ex) ann.splice(ann.indexOf(ex), 1);
      db.touch("annulations");
    } else if (a === "desinscrire") {
      var ins = db.t("inscriptions");
      var i = find(ins, function (x) { return x.creneau === str(o.creneau) && x.eleve === str(o.eleve); });
      if (!i) throw err("Inscription introuvable.");
      exigerMatiere(scope, i.matiere);
      db.set("inscriptions", ins.filter(function (x) { return x !== i; }));
      journal(db, now, "Annulée par la gestion", i, par);
    } else if (a === "matiere") {
      exigerAdmin(scope);
      // Modification partielle : les champs non fournis gardent leur valeur actuelle
      var exM = o.id ? find(db.t("matieres"), function (x) { return x.id === str(o.id); }) : null;
      if (exM) TABLES.matieres.forEach(function (k) { if (o[k] === undefined) o[k] = exM[k]; });
      if (!str(o.nom)) throw err("Nom de matière requis.");
      if (!find(db.t("classes"), function (c) { return c.id === str(o.classe); })) throw err("Classe inconnue.");
      var codeM = str(o.code).toUpperCase();
      if (codeM && codeM === String(db.reglage("code_admin", "")).toUpperCase()) throw err("Ce code est déjà le code administrateur.");
      if (codeM && codeM === String(db.reglage("code_acces", "")).toUpperCase()) throw err("Ce code est le code d'accès des élèves : choisis-en un autre, sinon tous les élèves pourraient gérer la matière.");
      if (o.couleur && !/^#[0-9a-fA-F]{6}$/.test(str(o.couleur))) throw err("Couleur invalide.");
      if (o.places !== undefined && !(+o.places >= 1 && +o.places <= 10)) throw err("Nombre d'élèves par créneau invalide (1 à 10).");
      if (o.duree !== undefined && !(+o.duree >= 5 && +o.duree <= 240)) throw err("Durée invalide (5 à 240 minutes).");
      res.id = upsert(db, "matieres", o, TABLES.matieres).id;
    } else if (a === "matiere_suppr") {
      exigerAdmin(scope);
      var mid = str(o.id);
      db.set("matieres", db.t("matieres").filter(function (x) { return x.id !== mid; }));
      var gone = {};
      ["regles", "ponctuels"].forEach(function (t) {
        db.set(t, db.t(t).filter(function (x) { if (x.matiere === mid) { gone[x.id] = 1; return false; } return true; }));
      });
      db.set("annulations", db.t("annulations").filter(function (x) { return !gone[x.source]; }));
    } else if (a === "classe") {
      exigerAdmin(scope);
      if (!str(o.nom)) throw err("Nom de classe requis.");
      res.id = upsert(db, "classes", o, TABLES.classes).id;
    } else if (a === "eleves") {
      exigerAdmin(scope);
      var cid = str(o.classe);
      if (!find(db.t("classes"), function (c) { return c.id === cid; })) throw err("Classe inconnue.");
      var noms = String(o.noms || "").split(/\n+/).map(function (n) { return n.replace(/\s*\(.*?\)\s*$/, "").replace(/^[*\-•\s]+/, "").replace(/\s+/g, " ").trim(); })
        .filter(function (n, k, arr) { return n && arr.indexOf(n) === k; });
      var anciens = db.t("eleves");
      var autres = anciens.filter(function (e) { return e.classe !== cid; });
      var liste = noms.map(function (n) {
        var ex = find(anciens, function (e) { return e.classe === cid && e.nom === n; });
        return ex || { classe: cid, nom: n, pin: "", echecs: "0" };
      });
      db.set("eleves", autres.concat(liste));
      res.nombre = liste.length;
      res.ajoutes = liste.filter(function (e) { return !find(anciens, function (x) { return x === e; }); }).length;
      res.retires = anciens.filter(function (e) { return e.classe === cid && liste.indexOf(e) < 0; }).length;
    } else if (a === "code_reset") {
      exigerAdmin(scope);
      var e = find(db.t("eleves"), function (x) { return x.classe === str(o.classe) && x.nom === str(o.nom); });
      if (!e) throw err("Élève introuvable.");
      e.pin = ""; e.echecs = "0"; db.touch("eleves");
      journal(db, now, "Code personnel réinitialisé", { classe: e.classe, eleve: e.nom }, par);
    } else if (a === "reglages") {
      exigerAdmin(scope);
      var jours = +o.ouverture_jours, heure = normHeure(o.ouverture_heure);
      if (!/^\d{1,3}$/.test(str(o.ouverture_jours)) || jours > 120) throw err("Nombre de jours invalide (0 à 120).");
      if (!heure) throw err("Heure d'ouverture invalide. Exemple : 12h");
      if (o.debut_annee && !isDate(o.debut_annee)) throw err("Date de rentrée invalide.");
      var rg = db.t("reglages");
      [["ouverture_jours", String(jours)], ["ouverture_heure", heure], ["debut_annee", str(o.debut_annee)]].forEach(function (kv) {
        if (!kv[1]) return;
        var x = find(rg, function (y) { return y.cle === kv[0]; });
        if (x) x.valeur = kv[1]; else rg.push({ cle: kv[0], valeur: kv[1] });
      });
      db.touch("reglages");
    } else if (a === "ouverture") {
      // Ouvrir une colle à la main (ou revenir à l'ouverture automatique)
      var mo = str(o.matiere), lo = str(o.lundi);
      exigerMatiere(scope, mo);
      if (!isDate(lo) || jourSemaine(lo) !== 1) throw err("Semaine invalide.");
      var ouv = db.t("ouvertures").filter(function (x) { return !(x.matiere === mo && x.lundi === lo); });
      if (o.ouvrir) ouv.push({ matiere: mo, lundi: lo, le: now.iso, par: par });
      db.set("ouvertures", ouv);
      var mm = find(db.t("matieres"), function (x) { return x.id === mo; });
      journal(db, now, o.ouvrir ? "Inscriptions ouvertes à la main" : "Ouverture automatique rétablie", { classe: mm ? mm.classe : "", matiere: mo, date: lo }, par);
    } else if (a === "code_acces") {
      exigerAdmin(scope);
      var nouveau = str(o.code);
      if (!/^[A-Za-z0-9]{4,20}$/.test(nouveau)) throw err("Le code doit faire de 4 à 20 lettres ou chiffres, sans espace.");
      var NOUV = nouveau.toUpperCase();
      if (NOUV === String(db.reglage("code_admin", "")).toUpperCase() || find(db.t("matieres"), function (m) { return m.code && m.code.toUpperCase() === NOUV; }))
        throw err("Ce code est déjà utilisé pour la gestion. Choisis-en un autre.");
      var rgA = db.t("reglages"), xA = find(rgA, function (y) { return y.cle === "code_acces"; });
      if (xA) xA.valeur = nouveau; else rgA.push({ cle: "code_acces", valeur: nouveau });
      db.touch("reglages");
    } else throw err("Action inconnue.");

    res.retirees = purger(db, now, par);
    return res;
  }

  function archiver(db, now) {
    var limite = addDays(now.date, -21), ins = db.t("inscriptions");
    var vieilles = ins.filter(function (i) { return i.date < limite; });
    if (vieilles.length < 40) return;
    vieilles.forEach(function (i) { db.ajouter("archives", i); });
    db.set("inscriptions", ins.filter(function (i) { return i.date >= limite; }));
  }

  /* ---------- Point d'entrée unique ---------- */
  function traiter(store, p, now) {
    var db = Db(store);
    p = p && typeof p === "object" ? p : {};
    try {
      var r;
      if (["reserver", "annuler", "gestion"].indexOf(str(p.action)) >= 0) archiver(db, now);
      switch (str(p.action)) {
        case "classes": verifierAcces(db, p); r = { ok: true, classes: db.t("classes").map(function (c) { return { id: c.id, nom: c.nom }; }) }; break;
        case "etat": r = etat(db, p, now); break;
        case "consulter": r = consulter(db, p, now); break;
        case "annuaire": r = annuaire(db, p, now); break;
        case "ics": r = icsCreneau(db, p); break;
        case "verifier": r = verifierCode(db, p); break;
        case "reserver": r = reserver(db, p, now); break;
        case "annuler": r = annuler(db, p, now); break;
        case "gestion_vue": r = vueGestion(db, p, now); break;
        case "gestion": r = gestion(db, p, now); break;
        default: throw err("Action inconnue.");
      }
      db.commit();
      return r;
    } catch (e) {
      if (e && e.utilisateur) return { ok: false, error: e.message };
      throw e;
    }
  }

  /* ---------- Données de départ ---------- */
  var BASES = [
    ["eco", "Économie", "#1461E0", "40"], ["droit", "Droit", "#0B7490", "40"], ["maths", "Mathématiques", "#7A3FD1", "60"],
    ["management", "Management", "#C2410C", "40"], ["espagnol", "Espagnol", "#B91C5C", "40"], ["francais", "Français", "#0F766E", "40"]
  ];
  var LISTES = {}; /* listes d'élèves : dans le Google Sheet */
  // codes : { admin, acces, "<id matière>": code }. Sans codes = démonstration (codes faciles).
  function depart(codes) {
    codes = codes || {};
    var info = "20 min de préparation, puis 20 min de passage";
    var lundiH = "12:00, 12:20, 12:40, 16:00, 16:20, 16:40", jeudiH = "08:00, 08:20, 08:40, 09:00, 17:00, 17:20";
    var src = function (id, matiere, jour, heures, debut) {
      return { id: id, matiere: matiere, jour: String(jour), heures: heures, frequence: "2", debut: debut, fin: "2027-05-28", salle: "", colleur: "" };
    };
    var classes = [{ id: "hec1", nom: "HEC1", code: "" }, { id: "hec2", nom: "HEC2", code: "" }];
    var eleves = [], matieres = [];
    classes.forEach(function (c) {
      (LISTES[c.id] || []).forEach(function (n) { eleves.push({ classe: c.id, nom: n, pin: "", echecs: "0" }); });
      BASES.forEach(function (b) {
        var id = b[0] + "-" + c.id;
        matieres.push({ id: id, classe: c.id, nom: b[1], couleur: b[2], duree: b[3], places: "2",
          info: c.id === "hec2" && (b[0] === "eco" || b[0] === "droit") ? info : b[0] === "francais" ? "Séances fixées au fil de l'année" : "",
          code: codes[id] || b[0] + (c.id === "hec1" ? "1" : "") });
      });
    });
    return {
      classes: classes, eleves: eleves, matieres: matieres,
      // Plannings connus. Les autres matières se saisissent dans l'espace gestion.
      regles: [
        src("r-eco-lun", "eco-hec2", 1, lundiH, "2026-09-21"),
        src("r-eco-jeu", "eco-hec2", 4, jeudiH, "2026-09-21"),
        src("r-droit-lun", "droit-hec2", 1, lundiH, "2026-09-28"),
        src("r-droit-jeu", "droit-hec2", 4, jeudiH, "2026-09-28")
      ],
      ponctuels: [], annulations: [], inscriptions: [], journal: [], ouvertures: [], archives: [],
      fermetures: FERME.map(function (f) { return { debut: f[0], fin: f[1], motif: f[2] }; }),
      reglages: [{ cle: "code_admin", valeur: codes.admin || "admin" }, { cle: "code_acces", valeur: codes.acces || "PREPA" }, { cle: "debut_annee", valeur: "2026-09-01" },
                 { cle: "ouverture_jours", valeur: "14" }, { cle: "ouverture_heure", valeur: "12:00" }]
    };
  }

  return {
    TABLES: TABLES, FERME: FERME, LYCEE: LYCEE, traiter: traiter, depart: depart, icsTexte: icsTexte,
    outils: { semaine: function (d) { return lundi(d); }, addDays: addDays, lundi: lundi, jourSemaine: jourSemaine, parseHeures: parseHeures, ferme: ferme, toMin: toMin, fromMin: fromMin, pad: pad }
  };
})();
if (typeof module !== "undefined") module.exports = COLLES;

</script>
<script>
/* =====================================================================
   Colloscope — site des élèves et espace de gestion
   ===================================================================== */
var CONFIG = {
  // Adresse du serveur (Google Apps Script). Vide = démonstration : les données restent sur cet appareil.
  API_URL: "https://script.google.com/macros/s/AKfycbxc2wT96Sy5CHCpXgQgq-q2oa-s8tN9_y-kVt8py0BkAxVstAQrcdwDMZ09Knxfl2l11w/exec",
  LYCEE: COLLES.LYCEE,
  SIGLE: "LSA"

/* ---------- Heure de Paris ---------- */
function maintenant() {
  var f = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  var p = {}; f.formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return { date: p.year + "-" + p.month + "-" + p.day, time: p.hour + ":" + p.minute, iso: p.year + "-" + p.month + "-" + p.day + "T" + p.hour + ":" + p.minute + ":" + p.second };
}

/* ---------- Serveur (ou démonstration locale) ---------- */
var CLE_DEMO = "colloscope-demo-v8";
var demo = null;
function demoData() { if (!demo) demo = LS.get(CLE_DEMO) || COLLES.depart(); return demo; }
var demoStore = {
  load: function (n) { return JSON.parse(JSON.stringify(demoData()[n] || [])); },
  append: function (n, rows) { demoData()[n] = (demoData()[n] || []).concat(JSON.parse(JSON.stringify(rows))); LS.set(CLE_DEMO, demo); },
  save: function (n, rows) { demoData()[n] = JSON.parse(JSON.stringify(rows)); LS.set(CLE_DEMO, demo); }
};
function api(p) {
  if (DEMO) {
    return new Promise(function (ok) {
      setTimeout(function () {
        try { ok(COLLES.traiter(demoStore, JSON.parse(JSON.stringify(p)), maintenant())); }
        catch (e) { console.error(e); ok({ ok: false, error: "Erreur inattendue." }); }
      }, 140);
    });
  }
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 40000);
  return fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(p), signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, error: "Connexion impossible. Vérifie ta connexion internet et réessaie." }; })
    .finally(function () { clearTimeout(t); });
}

/* ---------- État ---------- */
var CLE_PROFIL = "colloscope-profil";
var CLE_ACCES = "colloscope-acces";
function debutConnexion() { var c = LS.get(CLE_ACCES); return c ? { etape: "classe", code: c } : { etape: "acces" }; }
var S = { profil: LS.get(CLE_PROFIL), etat: null, ob: debutConnexion(), g: null, gm: "", gtab: "seances", vue: null, maj: false };
function profilComplet() { var p = S.profil; return !!(p && p.classe && p.code && p.eleve && p.pin); }
function sauverProfil() { LS.set(CLE_PROFIL, S.profil); }

/* ---------- Composants ---------- */
function toast(msg, ok) {
  var old = $(".toast"); if (old) old.remove();
  var el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.innerHTML = (ok === false ? "" : ICON.check) + '<span>' + esc(msg) + '</span>';
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 2800);
}
var dernierFocus = null;
function ouvrirFeuille(html, titreAria) {
  dernierFocus = document.activeElement;
  var c = $("#calques");
  c.innerHTML = '<div class="voile" data-act="fermer-voile"><div class="feuille" role="dialog" aria-modal="true" aria-label="' + esc(titreAria || "") + '">' + html + '</div></div>';
  var f = $(".feuille", c);
  var cible = $("input, textarea, select", f) || $("button.btn.primaire", f) || $("button", f);
  if (cible && !("ontouchstart" in window)) setTimeout(function () { cible.focus(); }, 30);
  return f;
}
function fermerFeuille() {
  $("#calques").innerHTML = "";
  if (dernierFocus && document.body.contains(dernierFocus)) try { dernierFocus.focus({ preventScroll: true }); } catch (e) {}
}
function enAttente(btn, texte) { btn.disabled = true; btn.dataset.txt = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>' + esc(texte || btn.textContent); }
function finAttente(btn) { if (btn && btn.dataset.txt) { btn.innerHTML = btn.dataset.txt; btn.disabled = false; } }
function chargement() { return '<div class="chargement" aria-label="Chargement"><i></i><i></i><i></i></div>'; }

function monogramme() { return '<img class="monogramme" src="' + LOGO + '" alt="" width="56" height="56">'; }
// En-tête : marque ou retour à gauche, actions à droite
function tete(o) {
  o = o || {};
  var g = o.retour
    ? '<button class="retour" data-act="' + (o.retourH !== undefined ? "aller" : (o.retourAct || "retour")) + '"' + (o.retourH !== undefined ? ' data-h="' + esc(o.retourH) + '"' : '') + '>' + ICON.retour + '<span>' + esc(o.retour) + '</span></button>'
    : '<div class="marque">' + monogramme() + '<span class="nom">Colloscope</span>' + (o.sous ? '<span class="sous">' + esc(o.sous) + '</span>' : '') + '</div>';
  var d = "";
  if (o.maj) d += '<button class="icone' + (S.maj ? " tourne" : "") + '" data-act="' + o.maj + '" aria-label="Actualiser">' + ICON.maj + '</button>';
  if (o.profil) d += '<button class="initiales" data-act="profil" aria-label="Mon profil">' + esc(initiales(o.profil)) + '</button>';
  return '<header class="tete">' + g + d + '</header>';
}
function avis(type, html, extra) {
  return '<div class="avis ' + (type || "") + '" role="' + (type === "attention" ? "status" : "note") + '">' + (type === "attention" ? ICON.attention : ICON.info) + '<span>' + html + '</span>' + (extra || "") + '</div>';
}
function bandeauDemo() {
  return DEMO ? '<p class="demo"><b>Démonstration.</b> Les données restent sur cet appareil. Code d\'accès <code>PREPA</code>, codes de gestion <code>eco</code>, <code>eco1</code>, <code>maths</code>… ou <code>admin</code>.</p>' : "";
}
function piedPage() {
  return (DEMO ? '<p class="note" style="margin-top:40px">Démonstration : les données restent sur cet appareil. Code d\'accès <code>PREPA</code>, codes de gestion <code>eco</code>, <code>eco1</code>, <code>maths</code>… ou <code>admin</code>.</p>' : '') +
    '<footer class="pied"' + (DEMO ? ' style="margin-top:16px"' : '') + '><span>' + esc(CONFIG.LYCEE) + '</span><button data-act="aller-gestion">Espace gestion</button>' +
    (DEMO ? '<button data-act="demo-reset">Réinitialiser la démo</button>' : '') + '</footer>';
}

function feuilleFormulaire(o) {
  var champs = o.champs.map(function (c) {
    var id = "f-" + c.id, v = c.valeur == null ? "" : c.valeur, input;
    if (c.type === "select") {
      input = '<select class="entree" id="' + id + '">' + c.options.map(function (op) {
        return '<option value="' + esc(op[0]) + '"' + (String(op[0]) === String(v) ? " selected" : "") + '>' + esc(op[1]) + '</option>';
      }).join("") + '</select>';
    } else if (c.type === "textarea") {
      input = '<textarea class="entree" id="' + id + '">' + esc(v) + '</textarea>';
    } else {
      input = '<input class="entree" id="' + id + '" type="' + (c.type || "text") + '" value="' + esc(v) + '" placeholder="' + esc(c.placeholder || "") + '"' + (c.attrs || "") + '>';
    }
    return '<label class="champ" for="' + id + '"><span>' + esc(c.label) + '</span>' + (c.aide ? '<small>' + esc(c.aide) + '</small>' : '') + input + '</label>';
  }).join("");
  ouvrirFeuille('<h3>' + esc(o.titre) + '</h3>' + (o.intro ? '<p class="note" style="font-size:14px;color:var(--encre-2)">' + o.intro + '</p>' : '') +
    '<form id="ff" class="formulaire" novalidate>' + champs + '<div class="erreur" id="ff-err" role="alert"></div>' +
    '<div class="actions" id="ff-actions"><button type="button" class="btn discret" data-act="fermer">Annuler</button>' +
    '<button type="submit" class="btn primaire" id="ff-ok">' + esc(o.bouton || "Enregistrer") + '</button></div></form>', o.titre);
  $("#ff").addEventListener("submit", function (e) {
    e.preventDefault();
    var vals = {};
    o.champs.forEach(function (c) { vals[c.id] = $("#f-" + c.id).value.trim(); });
    var btn = $("#ff-ok"); enAttente(btn);
    Promise.resolve(o.envoyer(vals)).then(function (r) {
      if (r && r.ok === false) { $("#ff-err").textContent = r.error; finAttente(btn); }
    });
  });
}
function feuilleConfirmer(titre, corps, bouton, danger, action) {
  ouvrirFeuille('<h3>' + esc(titre) + '</h3>' + corps + '<div class="erreur" id="fc-err" role="alert"></div>' +
    '<div class="pied-feuille"><button class="btn plein ' + (danger ? "danger" : "primaire") + '" id="fc-ok">' + esc(bouton) + '</button>' +
    '<button class="btn plein discret" data-act="fermer">Retour</button></div>', titre);
  $("#fc-ok").onclick = function () {
    var b = this; enAttente(b);
    Promise.resolve(action()).then(function (r) {
      if (r && r.ok === false) { $("#fc-err").textContent = r.error; finAttente(b); }
    });
  };
}

/* ---------- Agenda ---------- */
var URL_SITE = location.href.split("#")[0];
function lieuDe(c) { return c.salle ? "Salle " + c.salle + ", " + CONFIG.LYCEE : CONFIG.LYCEE; }
function titreEv(c) { return "Colle de " + c.matiereNom + (c.num ? " (colle " + c.num + ")" : ""); }
function icsTexte(c) { return COLLES.icsTexte(Object.assign({ url: URL_SITE }, c)); }
function telechargerIcs(c) {
  if (DEMO) { toast("L'aperçu bloque les téléchargements. Ça marchera sur le vrai site.", false); return; }
  var url = URL.createObjectURL(new Blob([icsTexte(c)], { type: "text/calendar;charset=utf-8" }));
  var a = document.createElement("a");
  a.href = url; a.download = "colle-" + c.matiereNom.toLowerCase().normalize("NFD").replace(/[^a-z]/g, "") + "-" + c.date + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
// Le fichier est servi par le serveur à une vraie adresse : c'est ce qui déclenche
// la fenêtre « Ajouter au calendrier » sur iPhone (un lien data: est bloqué par Safari).
function ajouterApple(c) {
  if (DEMO) { toast("L'aperçu bloque l'ouverture du calendrier. Ça marchera sur le vrai site.", false); return; }
  var url = CONFIG.API_URL + "?action=ics&c=" + encodeURIComponent(c.creneau) + "&app=" + encodeURIComponent(URL_SITE);
  var w = null;
  try { w = window.open(url, "_blank"); } catch (e) {}
  if (!w) location.href = url;   // fenêtre bloquée : on ouvre dans la même page
}
function lienGoogle(c) {
  var dt = function (d, t) { return d.replace(/-/g, "") + "T" + t.replace(":", "") + "00"; };
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(titreEv(c)) +
    "&dates=" + dt(c.date, c.debut) + "/" + dt(c.date, c.fin) + "&ctz=Europe/Paris&location=" + encodeURIComponent(lieuDe(c)) +
    "&details=" + encodeURIComponent((c.info || "") + "\n" + URL_SITE);
}
function feuilleAgenda(c) {
  ouvrirFeuille('<h3>Ajouter à mon agenda</h3><div class="resume"><span class="muet">' + esc(titreEv(c)) + ', ' + esc(dateLongue(c.date)) + ' à ' + hc(c.debut) + '</span></div>' +
    '<div class="choix">' +
    '<button class="ligne" data-act="ag-apple" data-c="' + esc(c.creneau) + '">' + ICON.agenda + '<span class="corps"><span class="principal">Calendrier Apple</span><span class="secondaire">iPhone, iPad et Mac</span></span></button>' +
    '<a class="ligne" href="' + esc(lienGoogle(c)) + '" target="_blank" rel="noopener" data-act="fermer">' + ICON.externe + '<span class="corps"><span class="principal">Google Agenda</span><span class="secondaire">S\'ouvre dans un nouvel onglet</span></span></a>' +
    '<button class="ligne" data-act="ag-fichier" data-c="' + esc(c.creneau) + '">' + ICON.fichier + '<span class="corps"><span class="principal">Samsung, Outlook ou autre</span><span class="secondaire">Télécharge un fichier .ics à ouvrir dans ton agenda</span></span></button>' +
    '</div><p class="note">Un rappel est prévu une heure avant. Si ta colle change, mets aussi ton agenda à jour.</p>' +
    '<button class="btn plein discret" data-act="fermer">Fermer</button>', "Ajouter à mon agenda");
}

/* =====================================================================
   Connexion : code d'accès (une fois), classe, nom, code personnel
   ===================================================================== */
function vueArrivee() {
  var ob = S.ob, html = '';
  var marque = '<div class="accueil"><div>' + monogramme() + '<h1>Colloscope</h1><p>Inscriptions aux colles de prépa.<br>' + esc(CONFIG.LYCEE) + '</p></div>';
  if (ob.etape === "acces") {
    html += marque + '<form class="formulaire" id="f-acces"><label class="champ" for="code-acces"><span>Code d\'accès</span>' +
      '<small>Le même pour toute la prépa. Tes délégués te l\'ont transmis. Il ne sera plus demandé sur cet appareil.</small>' +
      '<input class="entree" id="code-acces" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>' +
      '<div class="erreur" id="err" role="alert">' + esc(ob.erreur || "") + '</div><button class="btn primaire plein" id="ok">Continuer</button></form></div>' + piedPage();
  } else if (ob.etape === "classe") {
    html += marque + '<div class="section" style="margin-top:0"><h2>Ta classe</h2>';
    if (ob.erreur) html += avis("attention", esc(ob.erreur)) + '<button class="btn" data-act="reessayer-classes">Réessayer</button>';
    else if (!ob.classes) { html += chargement(); if (!ob.enCours) { ob.enCours = true; chargerClasses(); } }
    else html += '<div class="liste">' + ob.classes.map(function (c) {
      return '<button class="ligne" data-act="classe" data-id="' + esc(c.id) + '"><span class="corps"><span class="principal">' + esc(c.nom) + '</span></span>' + ICON.chev + '</button>';
    }).join("") + '</div>';
    html += '</div></div>' + piedPage();
  } else if (ob.etape === "nom") {
    html += tete({ retour: "Classes", retourAct: "ob-retour" }) + '<div class="titre"><h1>Qui es-tu ?</h1><p>' + esc(ob.classe.nom) + '. Choisis ton nom dans la liste.</p></div>' +
      '<div class="section"><div class="liste">' + (ob.eleves.length ? ob.eleves.map(function (n) {
        return '<button class="ligne" data-act="nom" data-nom="' + esc(n) + '"><span class="corps"><span class="principal">' + esc(n) + '</span></span>' + ICON.chev + '</button>';
      }).join("") : '<div class="vide">La liste des élèves de cette classe n\'a pas encore été ajoutée.</div>') + '</div></div>';
  } else if (ob.etape === "pin") {
    var nouveau = !ob.aCode;
    html += tete({ retour: "Changer de nom", retourAct: "ob-retour" }) + '<form class="formulaire" id="f-pin" style="margin-top:28px">' +
      '<div class="titre" style="padding:0"><h1>' + (nouveau ? "Bonjour " + esc(prenom(ob.eleve)) : "Bon retour, " + esc(prenom(ob.eleve))) + '</h1><p>' +
      (nouveau ? "Choisis un code à 4 chiffres. Il empêche quelqu'un d'autre de modifier tes créneaux. Il te sera demandé une seule fois par appareil."
               : "Entre ton code personnel à 4 chiffres.") + '</p></div>' +
      '<label class="champ" for="pin"><span>' + (nouveau ? "Nouveau code" : "Code personnel") + '</span>' +
      '<input class="entree code-pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required></label>' +
      '<div class="erreur" id="err" role="alert"></div><button class="btn primaire plein" id="ok">' + (nouveau ? "Créer mon code" : "Continuer") + '</button>' +
      (nouveau ? '' : '<p class="note">Code oublié ? Le délégué peut le réinitialiser depuis l\'espace gestion.</p>') + '</form>';
  }
  $("#app").innerHTML = html;
  if (ob.etape === "acces") $("#f-acces").onsubmit = soumettreAcces;
  if (ob.etape === "pin") $("#f-pin").onsubmit = soumettrePin;
  var f = $("#app input"); if (f && !("ontouchstart" in window)) f.focus();
}
function chargerClasses() {
  api({ action: "classes", code: S.ob.code }).then(function (r) {
    S.ob.enCours = false;
    if (!r.ok && /Code d'accès/.test(r.error)) { LS.del(CLE_ACCES); S.ob = { etape: "acces", erreur: "Le code d'accès a changé. Entre le nouveau code." }; }
    else if (!r.ok) S.ob.erreur = r.error;
    else { S.ob.classes = r.classes; S.ob.erreur = ""; }
    rendre();
  });
}
function soumettreAcces(e) {
  e.preventDefault();
  var code = $("#code-acces").value.trim(), b = $("#ok"); enAttente(b);
  api({ action: "classes", code: code }).then(function (r) {
    if (!r.ok) { $("#err").textContent = r.error; finAttente(b); return; }
    LS.set(CLE_ACCES, code);
    S.ob = { etape: "classe", code: code, classes: r.classes }; rendre();
  });
}
function choisirClasse(id) {
  var c = S.ob.classes.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  api({ action: "etat", classe: c.id, code: S.ob.code }).then(function (r) {
    if (!r.ok) { toast(r.error, false); if (/Code d'accès/.test(r.error)) { LS.del(CLE_ACCES); S.ob = { etape: "acces" }; rendre(); } return; }
    S.ob.classe = c; S.ob.eleves = r.eleves; S.ob.etape = "nom"; rendre();
  });
}
function soumettrePin(e) {
  e.preventDefault();
  var pin = $("#pin").value.trim(), b = $("#ok");
  if (!/^\d{4}$/.test(pin)) { $("#err").textContent = "Le code doit faire exactement 4 chiffres."; return; }
  enAttente(b);
  api({ action: "verifier", classe: S.ob.classe.id, code: S.ob.code, eleve: S.ob.eleve, pin: pin }).then(function (r) {
    if (!r.ok) { $("#err").textContent = r.error; finAttente(b); return; }
    S.profil = { classe: S.ob.classe.id, classeNom: S.ob.classe.nom, code: S.ob.code, eleve: S.ob.eleve, pin: pin };
    sauverProfil(); S.ob = debutConnexion(); S.etat = null;
    rendre();
  });
}

/* =====================================================================
   Élève : données
   ===================================================================== */
// Premier chargement depuis une vue : une seule requête à la fois, et pas de nouvel essai
// automatique après une erreur (sinon, hors connexion, la page relancerait sans fin).
function assurerEtat() {
  if (S.etatErreur) return;
  if (!S.etatEnCours) S.etatEnCours = chargerEtat().then(function (r) { S.etatEnCours = null; return r; });
}
function blocErreur(message, act) {
  return '<div class="section"><div class="liste"><div class="vide">' + esc(message) + '</div></div><button class="btn" data-act="' + act + '">Réessayer</button></div>';
}
function chargerEtat(silencieux) {
  var p = S.profil;
  return api({ action: "etat", classe: p.classe, code: p.code, eleve: p.eleve }).then(function (r) {
    var demande = S.maj; S.maj = false;
    if (!r.ok && !S.etat && !/Code d'accès|Classe introuvable/.test(r.error)) { S.etatErreur = r.error; rendre(); return r; }
    S.etatErreur = "";
    if (!r.ok) {
      if (/Code d'accès|Classe introuvable/.test(r.error)) {
        S.profil = null; LS.del(CLE_PROFIL);
        if (/Code d'accès/.test(r.error)) { LS.del(CLE_ACCES); toast("Le code d'accès a changé. Entre le nouveau code.", false); } else toast(r.error, false);
        S.ob = debutConnexion();
      }
      else if (!silencieux) toast(r.error, false);
      rendre(); return r;
    }
    if (!r.moi) { S.profil = null; LS.del(CLE_PROFIL); toast("Ton nom n'est plus dans la liste de la classe.", false); rendre(); return r; }
    // Rafraîchissement automatique : on ne redessine que si quelque chose a changé
    var cle = function (x) { return x ? JSON.stringify(Object.assign({}, x, { maintenant: "" })) : ""; };
    var change = cle(r) !== cle(S.etat);
    S.etat = r;
    if (r.classe && S.profil.classeNom !== r.classe.nom) { S.profil.classeNom = r.classe.nom; sauverProfil(); }
    if (change || !silencieux || demande) rendre();
    return r;
  });
}
function actualiser() { S.maj = true; S.etatErreur = ""; rendre(); chargerEtat(); }
function matiere(id) { return S.etat && S.etat.matieres.filter(function (m) { return m.id === id; })[0]; }
function semaine(m, lundi) { return m && m.semaines.filter(function (w) { return w.lundi === lundi; })[0]; }
function maColle(id) { return S.etat && S.etat.mesColles.filter(function (c) { return c.creneau === id; })[0]; }
function datesDe(w) { return w.seances.map(function (s) { return s.date; }); }
function colleCourante(m) { return m.semaines.filter(function (w) { return !w.termine && !w.annulee; })[0]; }

/* =====================================================================
   Élève : accueil — toutes les matières et leur état, puis mes colles
   ===================================================================== */
// Colle à afficher en priorité pour une matière : celle à réserver, sinon la prochaine
function colleUtile(m) {
  var ouvertes = m.semaines.filter(function (w) { return !w.termine && !w.annulee; });
  return ouvertes.filter(function (w) { return w.ouvert && !w.moi; })[0] || ouvertes[0] || null;
}
function statutMatiere(m) {
  var futures = S.etat.mesColles.filter(function (c) { return c.matiere === m.id && !c.passe; });
  var w = colleUtile(m);
  if (w && w.ouvert && !w.moi) return w.libres ? '<span class="statut a-faire">À réserver</span>' : '<span class="statut attente">Complet</span>';
  if (futures.length) { var c = futures[0]; return '<span class="statut fait">' + ICON.check + esc(dateCourte(c.date)) + ', ' + hc(c.debut) + '</span>'; }
  if (w && !w.ouvert) return '<span class="statut attente">Ouvre le ' + esc(jourNum(w.ouverture.date) + " " + MOIS_C[moisDe(w.ouverture.date)]) + '</span>';
  return '<span class="statut attente">' + (m.semaines.length ? "Rien à venir" : "Bientôt") + '</span>';
}
function vueAccueil() {
  var e = S.etat, p = S.profil;
  var html = tete({ sous: p.classeNom, maj: "maj", profil: p.eleve });
  if (!e) { $("#app").innerHTML = html + (S.etatErreur ? blocErreur(S.etatErreur, "reessayer-etat") : chargement()); assurerEtat(); return; }
  var suivante = e.mesColles.filter(function (c) { return !c.passe; })[0];
  html += '<div class="bonjour"><h1>Bonjour ' + esc(prenom(p.eleve)) + '</h1><p>' + esc(cap(dateLongue(e.aujourdhui))) + '</p>' +

/* ---------- Recherche d'un camarade (toutes classes) ---------- */
function chargerAnnuaire() {

  var plus = trouves.length - 6;

      (colles.length ? colles.map(function (c) {
        return '<div class="ligne"><span class="date-col"><b>' + jourNum(c.date).replace("er", "") + '</b><span>' + JOURS[O.jourSemaine(c.date)].slice(0, 3) + '.</span></span>' +
          '<span class="corps"><span class="matiere"><span class="pastille" style="--c:' + esc(c.couleur) + '"></span>' + esc(c.matiere) + '</span>' +
          '<span class="secondaire">' + esc(cap(dateLongue(c.date)) + ([c.colleur, c.salle ? "salle " + c.salle : ""].filter(Boolean).length ? ", " + [c.colleur, c.salle ? "salle " + c.salle : ""].filter(Boolean).join(", ") : "")) + '</span></span>' +
          '<span class="heure">' + plage(c.debut, c.fin) + '</span></div>';
      }).join("") : '<div class="vide">Aucune colle réservée pour l\'instant.</div>') + '</div>';
  }).join("") + (plus > 0 ? '<p class="note">' + plus + ' autre' + (plus > 1 ? "s" : "") + ' élève' + (plus > 1 ? "s" : "") + ' correspond' + (plus > 1 ? "ent" : "") + '. Précise la recherche.</p>' : '');
}

/* =====================================================================

function sieges(c) {

}
// Colleur et salle : toujours affichés, « à préciser » tant qu'ils ne sont pas saisis
function valeurOuManque(v) { return v ? esc(v) : '<span class="manque">à préciser</span>'; }

/* =====================================================================

function actionEleve(p) {

function formMatiere(id) {
  var g = S.g, m = id ? g.matieres.filter(function (x) { return x.id === id; })[0] : { classe: g.classes[0] && g.classes[0].id, couleur: "#7a3fd1", duree: 40, places: 2 };
  feuilleFormulaire({
    titre: id ? m.nom : "Nouvelle matière",
    champs: [
      { id: "nom", label: "Nom", valeur: m.nom, placeholder: "Mathématiques" },
      { id: "classe", label: "Classe", type: "select", options: g.classes.map(function (c) { return [c.id, c.nom]; }), valeur: m.classe },
      { id: "duree", label: "Durée d'une colle, en minutes", type: "number", valeur: m.duree, attrs: ' inputmode="numeric" min="5" max="240"' },
      { id: "places", label: "Élèves par créneau", type: "number", valeur: m.places, attrs: ' inputmode="numeric" min="1" max="10"' },
      { id: "info", label: "Précision pour les élèves", aide: "Facultatif", valeur: m.info, placeholder: "20 min de préparation, puis 20 min de passage" },
      { id: "couleur", label: "Couleur", type: "color", valeur: m.couleur },
      { id: "code", label: "Code de gestion", aide: "À donner au professeur ou au délégué qui gère cette matière.", valeur: m.code }
    ],
    envoyer: function (v) { v.id = id || ""; return opGestion("matiere", v, "Matière enregistrée"); }
  });
  if (id) ajouterSuppr("Supprimer " + m.nom + " ?", "Toutes ses règles, séances et inscriptions à venir seront supprimées.", function () { return opGestion("matiere_suppr", { id: id }, "Matière supprimée"); });
}
function formClasse(id) {
  var c = id ? S.g.classes.filter(function (x) { return x.id === id; })[0] : {};
  feuilleFormulaire({
    titre: id ? c.nom : "Nouvelle classe",
    champs: [
      { id: "nom", label: "Nom", valeur: c.nom, placeholder: "HEC1" },
    ],
    envoyer: function (v) { v.id = id || ""; return opGestion("classe", v, "Classe enregistrée"); }
  });
}
function formEleves(id) {
  var c = S.g.classes.filter(function (x) { return x.id === id; })[0];
  var noms = S.g.eleves.filter(function (e) { return e.classe === id; }).map(function (e) { return e.nom; }).join("\n");
  feuilleFormulaire({
    titre: "Élèves de " + c.nom,
    intro: "Un élève par ligne, au format NOM Prénom, sans titre ni nom de classe. Les codes personnels des élèves déjà présents sont conservés. Un élève retiré de la liste garde ses inscriptions déjà faites.",
    champs: [{ id: "noms", label: "Liste", type: "textarea", valeur: noms }],
    envoyer: function (v) {
      return api({ action: "gestion", gcode: gcode(), op: "eleves", data: { classe: id, noms: v.noms } }).then(function (r) {
        if (!r.ok) return r;
        fermerFeuille();
        toast("Liste enregistrée : " + r.nombre + " élève" + (r.nombre > 1 ? "s" : "") + (r.ajoutes ? ", " + r.ajoutes + " ajouté" + (r.ajoutes > 1 ? "s" : "") : "") + (r.retires ? ", " + r.retires + " retiré" + (r.retires > 1 ? "s" : "") : ""));
        S.etat = null; S.annuaire = null;
        return chargerGestion().then(function () { return r; });
      });
    }
  });
}
function feuilleCodes(id) {
  var c = S.g.classes.filter(function (x) { return x.id === id; })[0];
  var el = S.g.eleves.filter(function (e) { return e.classe === id; });
  ouvrirFeuille('<h3>Codes personnels</h3><p class="note" style="font-size:14px">Réinitialiser un code permet à l\'élève d\'en choisir un nouveau à sa prochaine connexion.</p>' +
    '<div class="liste">' + el.map(function (e) {
      return '<div class="ligne" style="min-height:48px;padding-block:6px"><span class="corps"><span class="principal">' + esc(e.nom) + '</span></span>' +
        (e.aCode ? '<button class="btn petit' + (e.bloque ? "" : " discret") + '" data-act="a-reset" data-classe="' + esc(id) + '" data-n="' + esc(e.nom) + '">' + (e.bloque ? "Débloquer" : "Réinitialiser") + '</button>' : '<span class="secondaire" style="color:var(--discret);font-size:13px">Pas encore connecté</span>') + '</div>';
    }).join("") + '</div><button class="btn plein discret" data-act="fermer">Fermer</button>', "Codes personnels de " + c.nom);
}

/* =====================================================================
   Routage et événements
   ===================================================================== */
function rendre() {
  var actif = document.activeElement, idActif = actif && actif.id, curseur = null;
  try { curseur = actif && actif.selectionStart; } catch (e) {}
  var hash = location.hash.replace("#", "");
  try { hash = decodeURIComponent(hash); } catch (e) { hash = ""; }
  if (hash === "gestion") vueGestion();
  else if (!profilComplet()) vueArrivee();
  else if (hash.indexOf("v~") === 0) { var v = hash.split("~"); vueConsultation(v[1], v[2], v[3]); }
  else if (hash.indexOf("m-") === 0) vueMatiere(hash.slice(2));
  else if (hash.indexOf("c-") === 0 && hash.length > 13) vueMatiere(hash.slice(2, -11), hash.slice(-10));
  else vueAccueil();
  majTete();
  ajusterSelect($("#sel-gm"));
  if (idActif && !$("#calques").innerHTML) {
    var el = document.getElementById(idActif);
    if (el && el !== actif && el.tagName === "INPUT") {
      try { el.focus({ preventScroll: true }); if (curseur != null) el.setSelectionRange(curseur, curseur); } catch (e) {}
    }
  }
}
function ajusterSelect(sel) {
  if (!sel) return;
  var m = document.createElement("span"), cs = getComputedStyle(sel);
  m.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  ["fontFamily", "fontSize", "fontWeight", "letterSpacing"].forEach(function (k) { m.style[k] = cs[k]; });
  m.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
  document.body.appendChild(m);
  sel.style.width = Math.ceil(m.getBoundingClientRect().width + 46) + "px";
  m.remove();
}
function majTete() { var t = $(".tete"); if (t) t.classList.toggle("defile", window.scrollY > 4); }
window.addEventListener("scroll", majTete, { passive: true });
window.addEventListener("hashchange", function () { $("#calques").innerHTML = ""; window.scrollTo(0, 0); rendre(); });

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var a = el.getAttribute("data-act"), d = el.dataset;
  if (a === "fermer" && el.tagName === "A") { setTimeout(fermerFeuille, 50); return; }
  if (a === "fermer-voile") { if (ev.target === el) fermerFeuille(); return; }
  switch (a) {
    case "fermer": fermerFeuille(); break;
    case "retour": location.hash = ""; break;
    case "choix-colle": history.replaceState(null, "", "#" + d.h); rendre(); break;
    case "maj": actualiser(); break;
    case "profil": feuilleProfil(); break;
    case "deconnexion": S.profil = null; LS.del(CLE_PROFIL); S.etat = null; S.vue = null; S.annuaire = null; S.recherche = ""; S.ob = debutConnexion(); fermerFeuille(); location.hash = ""; rendre(); break;
    case "reessayer-classes": S.ob.classes = null; S.ob.erreur = ""; rendre(); break;
    case "reessayer-etat": S.etatErreur = ""; rendre(); break;
    case "reessayer-gestion": S.gErreurReseau = ""; rendre(); break;
    case "classe": choisirClasse(d.id); break;
    case "nom": api({ action: "etat", classe: S.ob.classe.id, code: S.ob.code, eleve: d.nom }).then(function (r) {
      if (!r.ok || !r.moi) { toast(r.ok ? "Nom introuvable dans la liste." : r.error, false); return; }
      S.ob.eleve = d.nom; S.ob.aCode = !!r.moi.aCode; S.ob.etape = "pin"; rendre(); }); break;
    case "ob-retour":
      S.ob.etape = { nom: "classe", pin: "nom" }[S.ob.etape] || "classe";
      if (S.ob.etape === "nom" && !S.ob.eleves) S.ob.etape = "classe";
      rendre(); break;
    case "aller":
      if (location.hash.replace("#", "") === d.h) { fermerFeuille(); rendre(); } else location.hash = d.h;
      break;
    case "maj-vue": S.vue = null; S.maj = true; rendre(); break;
    case "creneau": cliqueCreneau(d.id); break;
    case "ma-colle": feuilleMaColle(maColle(d.c)); break;
    case "agenda": var c = maColle(d.c); if (c) feuilleAgenda(c); break;
    case "ag-apple": var c1 = maColle(d.c); if (c1) { fermerFeuille(); ajouterApple(c1); } break;
    case "ag-fichier": var c2 = maColle(d.c); if (c2) { fermerFeuille(); telechargerIcs(c2); } break;
    case "annuler": demanderAnnulation(d.c); break;
    case "vu": var vues = LS.get("colloscope-alertes-vues") || []; vues.push(d.k); LS.set("colloscope-alertes-vues", vues); rendre(); break;
    case "aller-gestion": location.hash = "gestion"; break;
    case "demo-reset": LS.del(CLE_DEMO); demo = null; S.etat = null; S.g = null; S.vue = null; S.annuaire = null; S.etatErreur = ""; toast("Démonstration réinitialisée"); rendre(); break;
    case "maj-gestion": S.maj = true; S.gErreurReseau = ""; rendre(); chargerGestion(); break;
    case "g-deco":
      SS.set("colloscope-gestion", ""); S.g = null; S.gErreur = ""; S.gErreurReseau = "";
      if (!profilComplet()) S.ob = debutConnexion();   // la liste des élèves a pu changer pendant la gestion
      S.etat = null; S.annuaire = null; S.vue = null;
      location.hash = ""; break;
    case "gtab": S.gtab = d.t; rendre(); break;
    case "g-annul":
      if (d.on === "1") feuilleFormulaire({
        titre: "Annuler la séance du " + dateLongue(d.date),
        intro: "Les élèves inscrits sont désinscrits et prévenus sur leur page d'accueil.",
        champs: [{ id: "motif", label: "Motif affiché aux élèves", aide: "Facultatif", placeholder: "Colleur absent" }],
        bouton: "Annuler la séance",
        envoyer: function (v) { return opGestion("annulation", { source: d.src, date: d.date, annuler: true, motif: v.motif }, "Séance annulée"); }
      });
      else opGestion("annulation", { source: d.src, date: d.date, annuler: false }, "Séance rétablie");
      break;
    case "g-desinscrire":
      feuilleConfirmer("Retirer " + d.n + " ?", '<p class="note" style="font-size:14px">La place redevient libre. L\'élève est prévenu sur sa page d\'accueil.</p>', "Retirer", true, function () {
        return opGestion("desinscrire", { creneau: d.c, eleve: d.n }, "Élève retiré");
      }); break;
    case "g-regle": formRegle(d.id); break;
    case "g-ponctuel": formPonctuel(d.id); break;
    case "a-matiere": formMatiere(d.id); break;
    case "a-classe": formClasse(d.id); break;
    case "a-eleves": formEleves(d.id); break;
    case "a-codes": feuilleCodes(d.id); break;
    case "a-acces":
      feuilleFormulaire({
        titre: "Code d'accès des élèves",
        intro: "Après un changement, chaque élève devra saisir le nouveau code une fois. Pense à le transmettre aux délégués.",
        champs: [{ id: "code", label: "Nouveau code", aide: "4 à 20 lettres ou chiffres", valeur: S.g.reglages.code_acces }],
        envoyer: function (v) { return opGestion("code_acces", v, "Code d'accès modifié"); }
      }); break;
    case "a-reset": opGestion("code_reset", { classe: d.classe, nom: d.n }, "Code réinitialisé").then(function () { feuilleCodes(d.classe); }); break;
    case "g-ouvrir":
      if (d.on === "1") feuilleConfirmer("Ouvrir la colle " + d.num + " de " + d.nom + " ?",
        '<p class="note" style="font-size:14px">Tout le monde pourra réserver dès maintenant. Préviens la classe en même temps, pour que chacun ait sa chance.</p>',
        "Ouvrir maintenant", false, function () { return opGestion("ouverture", { matiere: d.m, lundi: d.l, ouvrir: true }, "Inscriptions ouvertes"); });
      else feuilleConfirmer("Revenir à l'ouverture automatique ?",
        '<p class="note" style="font-size:14px">Si la date prévue n\'est pas encore passée, la colle sera refermée. Les inscriptions déjà faites sont conservées.</p>',
        "Revenir à l'automatique", true, function () { return opGestion("ouverture", { matiere: d.m, lundi: d.l, ouvrir: false }, "Ouverture automatique rétablie"); });
      break;
    case "a-reglages":
      feuilleFormulaire({
        titre: "Ouverture des inscriptions",
        intro: "Chaque colle ouvre à la même heure pour tout le monde.",
        champs: [
          { id: "ouverture_jours", label: "Jours avant le lundi de la colle", type: "number", valeur: S.g.reglages.ouverture_jours, attrs: ' inputmode="numeric" min="0" max="120"' },
          { id: "ouverture_heure", label: "Heure d'ouverture", valeur: hc(S.g.reglages.ouverture_heure), placeholder: "12h" },
          { id: "debut_annee", label: "Date de rentrée", aide: "Sert à numéroter les colles (Colle 1, 2, 3…). À changer chaque année.", type: "date", valeur: S.g.reglages.debut_annee }
        ],
        envoyer: function (v) { return opGestion("reglages", v, "Réglage enregistré"); }
      }); break;
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("#calques").innerHTML) fermerFeuille(); });
function rafraichir() {
  var hs = location.hash;
  if (S.rafraichit || document.visibilityState !== "visible" || !profilComplet() || !S.etat || $("#calques").innerHTML || hs === "#gestion" || hs.indexOf("#v~") === 0) return;
  S.rafraichit = true;
  chargerEtat(true).then(function () { S.rafraichit = false; }, function () { S.rafraichit = false; });
}
document.addEventListener("visibilitychange", rafraichir);
setInterval(rafraichir, 60000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ajusterSelect($("#sel-gm")); });

rendre();
</script>

</body>
</html>
