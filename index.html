  if (ob.etape === "prof-nouveau") $("#f-nouveau").onsubmit = soumettreNouveauCode;
  var f = $("#app input"); if (f && !("ontouchstart" in window)) f.focus();
}
function chargerClasses() {
  api({ action: "classes", code: S.ob.code }).then(function (r) {
    S.ob.enCours = false;
    if (!r.ok && /Code d'accès/.test(r.error)) { LS.del(CLE_ACCES); S.ob = { etape: "acces", erreur: "Le code d'accès a changé. Entre le nouveau code." }; }
    else if (!r.ok) S.ob.erreur = r.error;
    else { S.ob.classes = r.classes; S.ob.profs = !!r.profs; S.ob.erreur = ""; }
    rendre();
  });
}
// Professeurs et colleurs : nom, puis code personnel ; l'appareil s'en souvient, comme pour les élèves
var CLE_PROF = "colloscope-prof";
function choisirProfs() {
  api({ action: "professeurs", code: S.ob.code }).then(function (r) {
    if (!r.ok) { toast(r.error, false); if (/Code d'accès/.test(r.error)) { LS.del(CLE_ACCES); S.ob = { etape: "acces" }; rendre(); } return; }
    S.ob.profsNoms = r.noms; S.ob.colleurs = r.colleurs || []; S.ob.etape = "prof-nom"; rendre();
  });
}
function entrerGestion(nom, code) {
  LS.set(CLE_PROF, { nom: nom, code: code });
  SS.set("colloscope-gestion", code); SS.set("colloscope-gestion-nom", nom);
  S.g = null; S.gErreur = ""; S.gtab = "seances"; S.gAbs = {}; S.gJournal = null;
  S.ob = debutConnexion();
  if (location.hash === "#gestion") rendre(); else location.hash = "gestion";
}
function soumettreCodeProf(e) {
  e.preventDefault();
  var pcode = $("#pcode").value.trim(), b = $("#ok");
  if (!pcode) return;
  enAttente(b);
  api({ action: "prof_entrer", code: S.ob.code, nom: S.ob.prof, pcode: pcode }).then(function (r) {
    if (!r.ok) { $("#err").textContent = r.error; finAttente(b); return; }
    if (r.choisir) { S.ob.prof = r.nom; S.ob.pcode = pcode; S.ob.etape = "prof-nouveau"; rendre(); return; }
    entrerGestion(r.nom, pcode);
  });
}
function soumettreNouveauCode(e) {
  e.preventDefault();
  var n = $("#ncode").value.trim(), b = $("#ok");
  if (!/^[A-Za-z0-9]{6,20}$/.test(n)) { $("#err").textContent = "6 à 20 lettres ou chiffres, sans espace ni accent."; return; }
  enAttente(b);
  api({ action: "prof_choisir_code", gnom: S.ob.prof, gcode: S.ob.pcode, nouveau: n }).then(function (r) {
    if (!r.ok) { $("#err").textContent = r.error; finAttente(b); return; }
    entrerGestion(S.ob.prof, n);
    toast("Votre code est enregistré");
  });
}
function soumettreAcces(e) {
  e.preventDefault();
  var code = $("#code-acces").value.trim(), b = $("#ok"); enAttente(b);
  api({ action: "classes", code: code }).then(function (r) {
    if (!r.ok) { $("#err").textContent = r.error; finAttente(b); return; }
    LS.set(CLE_ACCES, code);
    S.ob = { etape: "classe", code: code, classes: r.classes, profs: !!r.profs }; rendre();
  });
}
function choisirClasse(id) {
  var c = S.ob.classes.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  api({ action: "etat", classe: c.id, code: S.ob.code }).then(function (r) {
    if (!r.ok) { toast(r.error, false); if (/Code d'accès/.test(r.error)) { LS.del(CLE_ACCES); S.ob = { etape: "acces" }; rendre(); } return; }
    S.ob.classe = c; S.ob.eleves = r.eleves; S.ob.etape = "nom"; rendre();
  });
}
function soumettrePin(e) {
  e.preventDefault();
  var pin = $("#pin").value.trim(), b = $("#ok");
  if (!/^\d{4}$/.test(pin)) { $("#err").textContent = "Le code doit faire exactement 4 chiffres."; return; }
  enAttente(b);
  api({ action: "verifier", classe: S.ob.classe.id, code: S.ob.code, eleve: S.ob.eleve, pin: pin }).then(function (r) {
    if (!r.ok) { $("#err").textContent = r.error; finAttente(b); return; }
    S.profil = { classe: S.ob.classe.id, classeNom: S.ob.classe.nom, code: S.ob.code, eleve: S.ob.eleve, pin: pin };
    sauverProfil(); S.ob = debutConnexion(); S.etat = null;
    rendre();
  });
}

/* =====================================================================
   Élève : données
   ===================================================================== */
// Premier chargement depuis une vue : une seule requête à la fois, et pas de nouvel essai
// automatique après une erreur (sinon, hors connexion, la page relancerait sans fin).
function assurerEtat() {
  if (S.etatErreur) return;
  if (!S.etatEnCours) S.etatEnCours = chargerEtat().then(function (r) { S.etatEnCours = null; return r; });
}
function blocErreur(message, act) {
  return '<div class="section"><div class="liste"><div class="vide">' + esc(message) + '</div></div><button class="btn" data-act="' + act + '">Réessayer</button></div>';
}
function chargerEtat(silencieux) {
  var p = S.profil;
  return api({ action: "etat", classe: p.classe, code: p.code, eleve: p.eleve }).then(function (r) { return appliquerEtat(r, silencieux); });
}
// Dernier état connu, gardé sur l'appareil : la page s'affiche tout de suite, puis se met à jour.
var CLE_ETAT = "colloscope-etat-v1";
function idProfil(p) { return p ? [p.classe, p.code, p.eleve].join("|") : ""; }
function etatMemorise() {
  if (DEMO || !profilComplet()) return null;
  var m = LS.get(CLE_ETAT);
  var frais = m && typeof m.le === "number" && Date.now() - m.le < 36 * 3600 * 1000;
  return frais && m.id === idProfil(S.profil) && m.etat && m.etat.ok && m.etat.matieres ? m.etat : null;
}
function appliquerEtat(r, silencieux) {
  var demande = S.maj; S.maj = false;
  if (!r.ok && !S.etat && !/Code d'accès|Classe introuvable/.test(r.error)) { S.etatErreur = r.error; rendre(); return r; }
  S.etatErreur = "";
  if (!r.ok) {
    if (/Code d'accès|Classe introuvable/.test(r.error)) {
      S.profil = null; S.etat = null; LS.del(CLE_PROFIL); LS.del(CLE_ETAT);
      if (/Code d'accès/.test(r.error)) { LS.del(CLE_ACCES); toast("Le code d'accès a changé. Entre le nouveau code.", false); } else toast(r.error, false);
      S.ob = debutConnexion();
    }
    else if (!silencieux) toast(r.error, false);
    rendre(); return r;
  }
  if (!r.moi) { S.profil = null; S.etat = null; LS.del(CLE_PROFIL); LS.del(CLE_ETAT); toast("Ton nom n'est plus dans la liste de la classe.", false); rendre(); return r; }
  // Rafraîchissement automatique : on ne redessine que si quelque chose a changé
  var cle = function (x) { return x ? JSON.stringify(Object.assign({}, x, { maintenant: "" })) : ""; };
  var change = cle(r) !== cle(S.etat);
  S.etat = r;
  if (!DEMO) LS.set(CLE_ETAT, { id: idProfil(S.profil), le: Date.now(), etat: r });
  if (r.classe && S.profil.classeNom !== r.classe.nom) { S.profil.classeNom = r.classe.nom; sauverProfil(); }
  if (change || !silencieux || demande) rendre();
  verifierAbonnement();
  return r;
}
function actualiser() { S.maj = true; S.etatErreur = ""; rendre(); chargerEtat(); }
function matiere(id) { return S.etat && S.etat.matieres.filter(function (m) { return m.id === id; })[0]; }
function semaine(m, lundi) { return m && m.semaines.filter(function (w) { return w.lundi === lundi; })[0]; }
function maColle(id) { return S.etat && S.etat.mesColles.filter(function (c) { return c.creneau === id; })[0]; }
function datesDe(w) { return w.seances.map(function (s) { return s.date; }); }
function aVenir() { return S.etat.mesColles.filter(function (c) { return !c.passe && !c.absence; }); }

/* =====================================================================
   Élève : accueil — matières, mes colles, ressources, camarades
   ===================================================================== */
// Colle à afficher en priorité pour une matière : celle à réserver, sinon la prochaine
function colleUtile(m) {
  var ouvertes = m.semaines.filter(function (w) { return !w.termine && !w.annulee; });
  return ouvertes.filter(function (w) { return w.ouvert && !w.moi && !w.absence; })[0] || ouvertes[0] || null;
}
function statutMatiere(m) {
  var futures = aVenir().filter(function (c) { return c.matiere === m.id; });
  var w = colleUtile(m);
  if (w && w.ouvert && !w.moi && !w.absence) return w.libres ? '<span class="statut a-faire">À réserver</span>' : '<span class="statut attente">Complet</span>';
  if (futures.length) { var c = futures[0]; return '<span class="statut fait">' + ICON.check + esc(dateCourte(c.date)) + ', ' + hc(c.debut) + '</span>'; }
  if (w && w.absence && !w.moi) return '<span class="statut attente">Absence signalée</span>';
  if (w && !w.ouvert) return '<span class="statut attente">Ouvre le ' + esc(jourNum(w.ouverture.date) + " " + MOIS_C[moisDe(w.ouverture.date)]) + '</span>';
  return '<span class="statut attente">' + (m.semaines.length ? "Rien à venir" : "Bientôt") + '</span>';
}
// Proposition reçue d'un camarade : « Léa te propose sa place… »
function texteDemande(d) {
  var quandA = '<b>' + esc(dateCourte(d.date)) + ' à ' + hc(d.debut) + '</b>';
  return d.contre
    ? '<b>' + esc(d.de) + '</b> te propose d\'échanger vos colles ' + esc(deM(d.matiereNom)) + ' : tu passerais le ' + quandA + ', au lieu du ' + esc(dateCourte(d.contre.date)) + ' à ' + hc(d.contre.debut) + '.'
    : '<b>' + esc(d.de) + '</b> te propose sa colle ' + esc(deM(d.matiereNom)) + ' du ' + quandA + '.';
}
function ligneAgenda(c, i, liste, auj) {
  var memeJour = i > 0 && liste[i - 1].date === c.date;
  var autreMois = c.date.slice(0, 7) !== auj.slice(0, 7);
  var sec = c.absence ? "Absence signalée" : c.remplacement ? "Proposée à " + c.remplacement.pour : ["Colle " + c.num, c.colleur, c.salle ? "salle " + c.salle : ""].filter(Boolean).join(", ");
  return '<button class="ligne' + (i === 0 && !c.absence ? " suivante" : "") + (c.absence ? " absente" : "") + '" data-act="ma-colle" data-c="' + esc(c.creneau) + '">' +
    '<span class="date-col"' + (memeJour ? ' style="visibility:hidden"' : '') + '><b>' + jourNum(c.date).replace("er", "") + '</b><span>' + JOURS[O.jourSemaine(c.date)].slice(0, 3) + '.</span>' +
    (autreMois ? '<span class="mois">' + MOIS_C[moisDe(c.date)] + '</span>' : '') + '</span>' +
    '<span class="corps"><span class="matiere"><span class="pastille" style="--c:' + esc(c.couleur) + '"></span>' + esc(c.matiereNom) + '</span>' +
    '<span class="secondaire">' + esc(sec) + '</span></span>' +
    '<span class="heure">' + h(c.debut) + '</span></button>';
}
function nomMatiere(id) { var m = matiere(id); return m ? m.nom : ""; }
function couleurMatiere(id) { var m = matiere(id); return m ? m.couleur : ""; }
function ligneRessource(r, auj, groupee) {
  return '<a class="ligne doc" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + (groupee ? '' : '<span class="pastille" style="--c:' + esc(couleurMatiere(r.matiere)) + '"></span>') +
    '<span class="corps"><span class="principal">' + esc(r.titre) + '</span><span class="secondaire">' + esc(cap([groupee ? "" : nomMatiere(r.matiere), quand(r.le, auj), r.taille ? octets(r.taille) : ""].filter(Boolean).join(" · "))) + '</span></span>' +
    '<span class="type" aria-label="' + (r.type === "fichier" ? "Document" : "Lien") + '">' + (r.type === "fichier" ? ICON.doc : ICON.lien) + '</span></a>';
}
function vueAccueil() {
  var e = S.etat, p = S.profil;
  var html = tete({ sous: p.classeNom, maj: "maj", profil: p.eleve });
  if (!e) { $("#app").innerHTML = html + (S.etatErreur ? blocErreur(S.etatErreur, "reessayer-etat") : chargement()); assurerEtat(); return; }
  var futures = aVenir(), suivante = futures[0];
  html += '<div class="bonjour"><h1>Bonjour ' + esc(prenom(p.eleve)) + '</h1><p>' + esc(cap(dateLongue(e.aujourdhui))) + '</p>' +
    (suivante ? '<button class="prochaine" data-act="ma-colle" data-c="' + esc(suivante.creneau) + '">Prochaine colle : <b>' + esc(suivante.matiereNom) + ', ' +
      esc(suivante.date === e.aujourdhui ? "aujourd'hui" : dateCourte(suivante.date)) + ' à ' + hc(suivante.debut) + '</b></button>' : '') + '</div>';

  // Propositions reçues, messages et alertes
  var vues = LS.get("colloscope-alertes-vues") || [], pile = [];
  (e.demandes || []).forEach(function (d) {
    pile.push('<div class="demande"><span>' + texteDemande(d) + '</span><div class="actions"><button class="btn petit discret" data-act="dem-non" data-id="' + esc(d.id) + '">Refuser</button>' +
      '<button class="btn petit primaire" data-act="dem-oui" data-id="' + esc(d.id) + '">Accepter</button></div></div>');
  });
  (e.infos || []).forEach(function (i) {
    var k = "i" + i.le + i.texte;
    if (vues.indexOf(k) < 0) pile.push(avis("bleu", esc(i.texte), '<button class="fermer-avis" data-act="vu" data-k="' + esc(k) + '" aria-label="Masquer">' + ICON.x + '</button>'));
  });
  e.alertes.forEach(function (a) {
    var k = a.date + a.heure + a.le;
    if (vues.indexOf(k) < 0) pile.push(avis("attention", "Ta colle de " + esc(a.matiereNom) + " du " + esc(dateLongue(a.date)) + " à " + hc(a.heure) + " a été annulée. Choisis un autre créneau.",
      '<button class="fermer-avis" data-act="vu" data-k="' + esc(k) + '" aria-label="Masquer">' + ICON.x + '</button>'));
  });
  if (pile.length) html += '<div class="pile">' + pile.join("") + '</div>';

  html += '<div class="section"><h2>Matières</h2><div class="liste">';
  if (!e.matieres.length) html += '<div class="vide">Les matières de ta classe n\'ont pas encore été configurées.</div>';
  html += e.matieres.map(function (m) {
    return '<button class="ligne mat" data-act="aller" data-h="m-' + esc(m.id) + '"><span class="pastille" style="--c:' + esc(m.couleur) + '"></span>' +
      '<span class="corps"><span class="principal">' + esc(m.nom) + '</span></span>' + statutMatiere(m) + ICON.chev + '</button>';
  }).join("") + '</div></div>';

  // Mes prochaines colles (une absence signalée reste visible le jour même)
  var liste = e.mesColles.filter(function (c) { return !c.passe; });
  html += '<div class="section"><h2>Mes prochaines colles</h2>';
  if (!liste.length) html += '<div class="liste"><div class="vide">Aucune colle réservée. Choisis une matière ci-dessus.</div></div>';
  else html += '<div class="liste agenda">' + liste.map(function (c, i) { return ligneAgenda(c, i, liste, e.aujourdhui); }).join("") + '</div>';
  html += '</div>';

  // Ressources déposées par les profs et les colleurs
  var res = e.ressources || [];
  html += '<div class="section"><div class="tete-section"><h2>Ressources</h2>' + (res.length > 3 ? '<button class="lien-section" data-act="aller" data-h="ressources">Tout voir (' + res.length + ')</button>' : '') + '</div>' +
    '<div class="liste">' + (res.length ? res.slice(0, 3).map(function (r) { return ligneRessource(r, e.aujourdhui); }).join("")
      : '<div class="vide">Corrections, fiches de méthode et documents de tes profs apparaîtront ici.</div>') + '</div></div>';

  html += '<div class="section"><h2><label for="cherche">Trouver un camarade</label></h2>' +
    '<input class="entree" id="cherche" type="search" placeholder="Nom ou prénom, en HEC1 ou en HEC2" autocomplete="off" spellcheck="false" value="' + esc(S.recherche || "") + '">' +
    '<div class="resultats" id="resultats">' + resultatsAnnuaire(S.recherche || "") + '</div>' +
    (e.autres && e.autres.length ? '<p class="note">Planning complet des ' + e.autres.map(function (c) {
      return '<button class="lien" style="font-size:13px" data-act="aller" data-h="v~' + esc(c.id) + '">' + esc(c.nom) + '</button>';
    }).join(", ") + '</p>' : '') + '</div>';
  html += piedPage();
  $("#app").innerHTML = html;
  var champ = $("#cherche");
  champ.addEventListener("focus", function () { if (!S.annuaire || Date.now() - S.annuaire.t > 60000) chargerAnnuaire(); });
  champ.addEventListener("input", function () {
    S.recherche = champ.value;
    if (!S.annuaire) { S.annuaireErreur = ""; chargerAnnuaire(); }
    $("#resultats").innerHTML = resultatsAnnuaire(champ.value);
  });
}
// Toutes les ressources, par matière
function vueRessources() {
  var e = S.etat;
  var html = tete({ retour: "Accueil", maj: "maj" });
  if (!e) { $("#app").innerHTML = html + (S.etatErreur ? blocErreur(S.etatErreur, "reessayer-etat") : chargement()); assurerEtat(); return; }
  html += '<div class="titre"><h1>Ressources</h1><p>Corrections, méthodes et documents déposés par tes profs et tes colleurs.</p></div>';
  var res = e.ressources || [];
  if (!res.length) html += '<div class="section"><div class="liste"><div class="vide">Aucun document pour l\'instant.</div></div></div>';
  e.matieres.forEach(function (m) {
    var siens = res.filter(function (r) { return r.matiere === m.id; });
    if (!siens.length) return;
    html += '<div class="groupe-ressources"><h2><span class="pastille" style="--c:' + esc(m.couleur) + '"></span>' + esc(m.nom) + '</h2><div class="liste">' +
      siens.map(function (r) { return ligneRessource(r, e.aujourdhui, true); }).join("") + '</div></div>';
  });
  $("#app").innerHTML = html;
}

/* ---------- Recherche d'un camarade (toutes classes) ---------- */
function chargerAnnuaire() {
  if (S.annuaireEnCours) return S.annuaireEnCours;
  var p = S.profil;
  S.annuaireEnCours = api({ action: "annuaire", classe: p.classe, code: p.code }).then(function (r) {
    S.annuaireEnCours = null;
    if (r.ok) { r.t = Date.now(); S.annuaire = r; S.annuaireErreur = ""; } else S.annuaireErreur = r.error;
    var zone = $("#resultats"), champ = $("#cherche");
    if (zone && champ) zone.innerHTML = resultatsAnnuaire(champ.value);
    return r;
  });
  return S.annuaireEnCours;
}
function resultatsAnnuaire(q) {
  q = sansAccent(String(q).trim());
  if (q.length < 2) return "";
  var a = S.annuaire;
  if (!a && S.annuaireErreur) return '<div class="liste"><div class="vide">' + esc(S.annuaireErreur) + '</div></div>';
  if (!a) return '<div class="liste"><div class="vide">Recherche…</div></div>';
  var nomsClasses = {};
  a.classes.forEach(function (c) { nomsClasses[c.id] = c.nom; });
  var trouves = a.eleves.filter(function (e) { return sansAccent(e.nom).indexOf(q) >= 0; })
    .sort(function (x, y) { return x.nom.localeCompare(y.nom, "fr"); });
  if (!trouves.length) return '<div class="liste"><div class="vide">Aucun élève ne correspond à « ' + esc(q) + ' ».</div></div>';
  var plus = trouves.length - 6;
  return trouves.slice(0, 6).map(function (e) {
    var colles = a.colles.filter(function (c) { return c.nom === e.nom && c.classe === e.classe; });
    return '<div class="liste agenda"><div class="ligne eleve-tete"><span class="corps"><span class="principal">' + esc(e.nom) + '</span></span><span class="tag">' + esc(nomsClasses[e.classe] || "") + '</span></div>' +
      (colles.length ? colles.map(function (c) {
        return '<div class="ligne"><span class="date-col"><b>' + jourNum(c.date).replace("er", "") + '</b><span>' + JOURS[O.jourSemaine(c.date)].slice(0, 3) + '.</span></span>' +
          '<span class="corps"><span class="matiere"><span class="pastille" style="--c:' + esc(c.couleur) + '"></span>' + esc(c.matiere) + '</span>' +
          '<span class="secondaire">' + esc(cap(dateLongue(c.date)) + ([c.colleur, c.salle ? "salle " + c.salle : ""].filter(Boolean).length ? ", " + [c.colleur, c.salle ? "salle " + c.salle : ""].filter(Boolean).join(", ") : "")) + '</span></span>' +
          '<span class="heure">' + plage(c.debut, c.fin) + '</span></div>';
      }).join("") : '<div class="vide">Aucune colle réservée pour l\'instant.</div>') + '</div>';
  }).join("") + (plus > 0 ? '<p class="note">' + plus + ' autre' + (plus > 1 ? "s" : "") + ' élève' + (plus > 1 ? "s" : "") + ' correspond' + (plus > 1 ? "ent" : "") + '. Précise la recherche.</p>' : '');
}

/* =====================================================================
   Élève : une matière — choix de la colle en haut, créneaux en dessous
   ===================================================================== */
function sieges(c) {
  var pris = c.places - c.restantes, out = "";
  for (var i = 0; i < Math.min(c.places, 6); i++) out += '<i class="siege ' + (i < pris ? (c.etat === "moi" && i === 0 ? "moi" : "pris") : "") + '"></i>';
  return '<span class="sieges" aria-hidden="true">' + out + '</span>';
}
// Colleur et salle : toujours affichés, « à préciser » tant qu'ils ne sont pas saisis
function valeurOuManque(v) { return v ? esc(v) : '<span class="manque">à préciser</span>'; }
function metaSeance(s, m) {
  return '<p class="meta-seance"><span>Colleur <b>' + valeurOuManque(s.colleur) + '</b></span><span>Salle <b>' + valeurOuManque(s.salle) + '</b></span>' +
    (m && s.duree && s.duree !== m.duree ? '<span>Durée <b>' + s.duree + ' min</b></span>' : '') + '</p>';
}
// Programme et consignes écrits par le prof pour cette colle
function programme(texte, titre, cls) {
  return texte ? '<div class="programme' + (cls ? " " + cls : "") + '"><h4>' + esc(titre || "Programme et consignes") + '</h4><p>' + esc(texte) + '</p></div>' : '';
}
function infosSeance(colleur, salle) {
  return '<dl class="infos"><div><dt>Colleur</dt><dd>' + valeurOuManque(colleur) + '</dd></div><div><dt>Salle</dt><dd>' + valeurOuManque(salle) + '</dd></div></dl>';
}
// Heure + noms des inscrits, comme sur la feuille papier
function celluleHeure(c, moi) {
  var noms = (c.noms || []).map(function (n) { return n === moi ? "Toi" : n; });
  noms.sort(function (a, b) { return a === "Toi" ? -1 : b === "Toi" ? 1 : 0; });
  return '<span class="cell-h"><span class="heure">' + h(c.debut) + ' <span>– ' + h(c.fin) + '</span></span>' +
    (noms.length ? '<span class="noms">' + esc(noms.join(", ")) + '</span>' : '') + '</span>';
}
function etatCreneau(c, w) {
  if (c.etat === "moi") return { cls: "inscrit", txt: '<span class="e-inscrit">Inscrit</span>' };
  if (c.etat === "absent") return { cls: "absent", txt: '<span class="e-absent">Absent</span>' };
  if (c.etat === "passe") return { cls: "passe", txt: '<span class="e-complet">Passé</span>' };
  if (c.etat === "complet") return { cls: "complet", txt: '<span class="e-complet">Complet</span>' };
  if (!w.ouvert) return { cls: "ferme", txt: '<span class="e-ferme">Fermé</span>' };
  if (c.etat === "conflit") return { cls: "conflit", txt: '<span class="e-ferme">Autre colle</span>' };
  if (c.restantes === 1 && c.places > 1) return { cls: "libre", txt: '<span class="e-dernier">Dernière place</span>' };
  return { cls: "libre", txt: '<span class="e-libre">' + places(c.restantes) + '</span>' };
}
function vueMatiere(mid, lundi) {
  var e = S.etat;
  if (!e) { $("#app").innerHTML = tete({ retour: "Accueil" }) + (S.etatErreur ? blocErreur(S.etatErreur, "reessayer-etat") : chargement()); assurerEtat(); return; }
  var m = matiere(mid);
  if (!m) { location.hash = ""; return; }
  var visibles = m.semaines.filter(function (w) { return !w.termine; });
  var w = (lundi && semaine(m, lundi)) || colleUtile(m) || visibles[0];
  var html = tete({ retour: "Accueil", maj: "maj" });
  var rythme = m.periode === "libre" ? "Colles à dates libres" : m.periode > 1 ? "Une colle toutes les " + m.periode + " semaines" : "";
  var infosM = [m.info, rythme, m.places > 1 ? m.places + " élèves par créneau" : ""].filter(Boolean);
  html += '<div class="titre"><h1>' + esc(m.nom) + '</h1><p>' + esc(infosM.join(". ")) + (infosM.length ? "." : "") + '</p></div>';
  if (!w) {
    html += '<div class="section"><div class="liste"><div class="vide">' + (m.semaines.length ? "Aucune colle à venir pour l'instant." : m.periode === "libre" ? "Aucune colle prévue pour l'instant. Les prochaines apparaîtront ici dès que le prof les aura fixées." : "Le planning de cette matière n'a pas encore été saisi. Il apparaîtra ici.") + '</div></div></div>';
    $("#app").innerHTML = html; return;
  }
  if (visibles.indexOf(w) < 0) visibles.unshift(w);
  html += '<nav class="colles" aria-label="Choisir la colle">' + visibles.map(function (x) {
    return '<button class="colle-choix' + (x.termine ? " finie" : "") + '" data-act="choix-colle" data-h="c-' + esc(m.id) + "-" + x.lundi + '" aria-current="' + (x === w) + '">' +
      '<b>Colle ' + x.num + (x.moi ? '<i class="pt" aria-label="inscrit"></i>' : '') + '</b><span>' + esc(listeDates(datesDe(x))) + '</span></button>';
  }).join("") + '</nav>';

  if (w.annulee) html += '<div style="margin-top:20px">' + avis("attention", "Cette colle est annulée.") + '</div>';
  else if (!w.ouvert) html += '<div style="margin-top:20px">' + avis("", "Les inscriptions ouvrent le <b>" + esc(dateLongue(w.ouverture.date)) + " à " + hc(w.ouverture.heure) + "</b>. Tu peux déjà voir les créneaux.") + '</div>';
  else if (w.moi) html += '<div style="margin-top:20px">' + avis("bleu", "Tu es inscrit <b>" + esc(dateLongue(w.moi.date)) + " à " + hc(w.moi.debut) + "</b>. Touche un autre créneau pour changer.") + '</div>';
  else if (w.absence) html += '<div style="margin-top:20px">' + avis("attention", "Tu as signalé ton absence le <b>" + esc(dateLongue(w.absence.date)) + " à " + hc(w.absence.debut) + "</b>. Tu peux encore choisir un autre créneau de cette colle.") + '</div>';
  else if (!w.termine) html += '<p class="note" style="margin-top:16px">Choisis un seul créneau pour la colle ' + w.num + ', sur l\'une de ces dates.</p>';
  if (w.detail && !w.annulee) html += '<div class="programme eleve"><h2>Programme et consignes</h2><p>' + esc(w.detail) + '</p></div>';

  var parDate = {};
  w.seances.forEach(function (s) { (parDate[s.date] = parDate[s.date] || []).push(s); });
  Object.keys(parDate).sort().forEach(function (d) {
    var finie = !w.termine && parDate[d].every(function (s) { return !s.annule && s.creneaux.every(function (c) { return c.etat === "passe"; }); });
    if (finie) return;
    parDate[d].forEach(function (s, k) {
      html += '<div class="jour">' + (k === 0 ? '<div class="jour-tete"><h2>' + esc(cap(dateLongue(d))) + '</h2></div>' : '') + metaSeance(s, m) + '<div class="liste">';
      if (s.annule) html += '<div class="annulee">Séance annulée' + (s.annule !== "Séance annulée" ? ". " + esc(s.annule) : "") + '</div>';
      else html += s.creneaux.map(function (c) {
        var st = etatCreneau(c, w);
        var off = c.etat === "passe" || c.etat === "complet" || ((c.etat === "libre" || c.etat === "conflit") && !w.ouvert);
        return '<button class="creneau ' + st.cls + '" data-act="creneau" data-id="' + esc(c.id) + '"' + (off ? " disabled" : "") +
          ' aria-label="' + esc(plage(c.debut, c.fin)) + '">' + celluleHeure(c, S.profil.eleve) + sieges(c) +
          '<span class="etat">' + st.txt + '</span></button>';
      }).join("");
      html += '</div></div>';
    });
  });
  $("#app").innerHTML = html;
  var actif = $('.colle-choix[aria-current="true"]');
  if (actif && actif.scrollIntoView) actif.scrollIntoView({ block: "nearest", inline: "nearest" });
}
/* =====================================================================
   Consultation d'une autre classe — lecture seule
   ===================================================================== */
function chargerConsult(cid) {
  var p = S.profil;
  return api({ action: "consulter", classe: p.classe, code: p.code, cible: cid }).then(function (r) {
    S.maj = false; S.vueEnCours = null;
    if (!r.ok) { toast(r.error, false); location.hash = ""; return; }
    S.vue = { cid: cid, data: r }; rendre();
  });
}
function sansAccent(t) { return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function prochaineColle(m) { return m.semaines.filter(function (w) { return !w.termine && !w.annulee; })[0]; }
function vueConsultation(cid, mid, lundi) {
  if (!S.vue || S.vue.cid !== cid) {
    $("#app").innerHTML = tete({ retour: "Accueil", retourH: "" }) + chargement();
    if (S.vueEnCours !== cid) { S.vueEnCours = cid; chargerConsult(cid); }
    return;
  }
  var d = S.vue.data, html;
  var badge = '<span class="lecture-seule">' + ICON.info + 'Consultation seulement</span>';
  if (!mid) {
    html = tete({ retour: "Accueil", retourH: "", maj: "maj-vue" }) +
      '<div class="titre"><h1>' + esc(d.classe.nom) + '</h1><p>Horaires et inscrits. Tu ne peux pas t\'inscrire dans cette classe.</p></div>';
    html += '<div class="section"><h2>Matières</h2><div class="liste">' + (d.matieres.length ? d.matieres.map(function (m) {
      var w = prochaineColle(m);

      { id: "code", label: "Code de gestion pour cette classe", aide: "En général, le même dans toutes les classes : à régler dans « Codes par matière ».", valeur: m.code }
    ],
    envoyer: function (v) { v.id = id || ""; return opGestion("matiere", v, "Matière enregistrée"); }
  });
  if (id) ajouterSuppr("Supprimer " + m.nom + " ?", "Toutes ses règles, séances et inscriptions à venir seront supprimées.", function () { return opGestion("matiere_suppr", { id: id }, "Matière supprimée"); });
}
function formClasse(id) {
  var c = id ? S.g.classes.filter(function (x) { return x.id === id; })[0] : {};
  feuilleFormulaire({
    titre: id ? c.nom : "Nouvelle classe",
    champs: [{ id: "nom", label: "Nom", valeur: c.nom, placeholder: "HEC1" }],
    envoyer: function (v) { v.id = id || ""; return opGestion("classe", v, "Classe enregistrée"); }
  });
}
function formEleves(id) {
  var c = S.g.classes.filter(function (x) { return x.id === id; })[0];
  var noms = S.g.eleves.filter(function (e) { return e.classe === id; }).map(function (e) { return e.nom; }).join("\n");
  feuilleFormulaire({
    titre: "Élèves de " + c.nom,
    intro: "Un élève par ligne, au format NOM Prénom, sans titre ni nom de classe. Les codes personnels des élèves déjà présents sont conservés. Un élève retiré de la liste garde ses inscriptions déjà faites.",
    champs: [{ id: "noms", label: "Liste", type: "textarea", valeur: noms }],
    envoyer: function (v) {
      return api(gp({ action: "gestion", op: "eleves", data: { classe: id, noms: v.noms } })).then(function (r) {
        if (!r.ok) return r;
        fermerFeuille();
        toast("Liste enregistrée : " + r.nombre + " élève" + (r.nombre > 1 ? "s" : "") + (r.ajoutes ? ", " + r.ajoutes + " ajouté" + (r.ajoutes > 1 ? "s" : "") : "") + (r.retires ? ", " + r.retires + " retiré" + (r.retires > 1 ? "s" : "") : ""));
        S.etat = null; S.annuaire = null; S.gAbs = {};
        return chargerGestion().then(function () { return r; });
      });
    }
  });
}
function feuilleCodes(id) {
  var c = S.g.classes.filter(function (x) { return x.id === id; })[0];
  var el = S.g.eleves.filter(function (e) { return e.classe === id; });
  ouvrirFeuille('<h3>Codes personnels</h3><p class="note" style="font-size:14px">Réinitialiser un code permet à l\'élève d\'en choisir un nouveau à sa prochaine connexion.</p>' +
    '<div class="liste">' + el.map(function (e) {
      return '<div class="ligne" style="min-height:48px;padding-block:6px"><span class="corps"><span class="principal">' + esc(e.nom) + '</span></span>' +
        (e.aCode ? '<button class="btn petit' + (e.bloque ? "" : " discret") + '" data-act="a-reset" data-classe="' + esc(id) + '" data-n="' + esc(e.nom) + '">' + (e.bloque ? "Débloquer" : "Réinitialiser") + '</button>' : '<span class="secondaire" style="color:var(--discret);font-size:13px">Pas encore connecté</span>') + '</div>';
    }).join("") + '</div><button class="btn plein discret" data-act="fermer">Fermer</button>', "Codes personnels de " + c.nom);
}
function seanceGestion(src, date) {
  var trouve = null;
  if (S.g.colleur) S.g.seances.forEach(function (s) { if (s.source === src && s.date === date) trouve = s; });
  else S.g.matieres.forEach(function (m) { m.semaines.forEach(function (x) { x.seances.forEach(function (y) { if (y.source === src && y.date === date) trouve = y; }); }); });
  return trouve;
}

/* =====================================================================
   Routage et événements
   ===================================================================== */
function rendre() {
  var actif = document.activeElement, idActif = actif && actif.id, curseur = null;
  try { curseur = actif && actif.selectionStart; } catch (e) {}
  var hash = location.hash.replace("#", "");
  try { hash = decodeURIComponent(hash); } catch (e) { hash = ""; }
  if (hash === "gestion") vueGestion();
  else if (!profilComplet() && !hash && LS.get(CLE_PROF)) { location.hash = "gestion"; return; }
  else if (!profilComplet()) vueArrivee();
  else if (hash.indexOf("v~") === 0) { var v = hash.split("~"); vueConsultation(v[1], v[2], v[3]); }
  else if (hash === "ressources") vueRessources();
  else if (hash.indexOf("m-") === 0) vueMatiere(hash.slice(2));
  else if (hash.indexOf("c-") === 0 && hash.length > 13) vueMatiere(hash.slice(2, -11), hash.slice(-10));
  else vueAccueil();
  majTete();
  ajusterSelect($("#sel-gm"));
  ajusterSelect($("#sel-gc"));
  if (S.nouvelleVersion && !$(".maj-dispo")) document.body.insertAdjacentHTML("beforeend", '<div class="maj-dispo" role="status"><span>Nouvelle version du Colloscope</span><button class="btn petit primaire" data-act="recharger">Mettre à jour</button></div>');
  if (idActif && !$("#calques").innerHTML) {
    var el = document.getElementById(idActif);
    if (el && el !== actif && el.tagName === "INPUT") {
      try { el.focus({ preventScroll: true }); if (curseur != null) el.setSelectionRange(curseur, curseur); } catch (e) {}
    }
  }
}
function ajusterSelect(sel) {
  if (!sel) return;
  var m = document.createElement("span"), cs = getComputedStyle(sel);
  m.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  ["fontFamily", "fontSize", "fontWeight", "letterSpacing"].forEach(function (k) { m.style[k] = cs[k]; });
  m.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
  document.body.appendChild(m);
  sel.style.width = Math.ceil(m.getBoundingClientRect().width + 46) + "px";
  m.remove();
}
function majTete() { var t = $(".tete"); if (t) t.classList.toggle("defile", window.scrollY > 4); }
window.addEventListener("scroll", majTete, { passive: true });
window.addEventListener("hashchange", function () { $("#calques").innerHTML = ""; window.scrollTo(0, 0); rendre(); });

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var a = el.getAttribute("data-act"), d = el.dataset;
  if (a === "fermer" && el.tagName === "A") { setTimeout(fermerFeuille, 50); return; }
  if (a === "fermer-voile") { if (ev.target === el) fermerFeuille(); return; }
  switch (a) {
    case "fermer": fermerFeuille(); break;
    case "retour": location.hash = ""; break;

    case "maj": actualiser(); break;
    case "profil": feuilleProfil(); break;
    case "notif": if (!el.disabled) basculerNotif(d.k); break;
    case "notif-essai": essaiNotif(el); break;
    case "deconnexion": deconnexion(); break;
    case "reessayer-classes": S.ob.classes = null; S.ob.erreur = ""; rendre(); break;
    case "reessayer-etat": S.etatErreur = ""; rendre(); break;
    case "reessayer-gestion": S.gErreurReseau = ""; rendre(); break;
    case "classe": choisirClasse(d.id); break;
    case "nom": api({ action: "etat", classe: S.ob.classe.id, code: S.ob.code, eleve: d.nom }).then(function (r) {
      if (!r.ok || !r.moi) { toast(r.ok ? "Nom introuvable dans la liste." : r.error, false); return; }
      S.ob.eleve = d.nom; S.ob.aCode = !!r.moi.aCode; S.ob.etape = "pin"; rendre(); }); break;
    case "ob-profs": choisirProfs(); break;
    case "prof-nom": S.ob.prof = d.nom; S.ob.etape = "prof-code"; rendre(); break;
    case "prof-plus-tard": entrerGestion(S.ob.prof, S.ob.pcode); break;
    case "ob-retour":
      S.ob.etape = { nom: "classe", pin: "nom", "prof-nom": "classe", "prof-code": "prof-nom" }[S.ob.etape] || "classe";
      if (S.ob.etape === "nom" && !S.ob.eleves) S.ob.etape = "classe";
      rendre(); break;
    case "aller":
      if (location.hash.replace("#", "") === d.h) { fermerFeuille(); rendre(); } else location.hash = d.h;
      break;
    case "maj-vue": S.vue = null; S.maj = true; rendre(); break;
    case "creneau": cliqueCreneau(d.id); break;
    case "ma-colle": feuilleMaColle(maColle(d.c)); break;
    case "agenda": var c = maColle(d.c); if (c) feuilleAgenda(c); break;
    case "ag-fichier": var c2 = maColle(d.c); if (c2) { fermerFeuille(); telechargerIcs(c2); } break;
    case "annuler": demanderAnnulation(d.c); break;
    case "absent": demanderAbsence(d.c); break;
    case "revenir": el.disabled = true; revenirAbsence(d.c); break;
    case "remplacer": feuilleRemplacer(d.c); break;
    case "remplacer-avec": feuilleProposer(d.c, d.n); break;
    case "proposer": proposer(d.c, d.n, d.e === "1", el); break;
    case "retirer-demande": el.disabled = true; retirerDemande(d.id); break;
    case "dem-oui": repondreDemande(d.id, true); break;
    case "dem-non": el.disabled = true; repondreDemande(d.id, false); break;
    case "vu": var vues = LS.get("colloscope-alertes-vues") || []; vues.push(d.k); LS.set("colloscope-alertes-vues", vues.slice(-60)); rendre(); break;
    case "aller-gestion": location.hash = "gestion"; break;
    case "demo-reset": LS.del(CLE_DEMO); demo = null; S.etat = null; S.g = null; S.vue = null; S.annuaire = null; S.etatErreur = ""; S.gAbs = {}; S.gJournal = null; toast("Démonstration réinitialisée"); rendre(); break;
    case "maj-gestion": S.maj = true; S.gErreurReseau = ""; S.gAbs = {}; S.gJournal = null; rendre(); chargerGestion(); break;
    case "g-deco":
      quitterGestion();
      if (!profilComplet()) S.ob = debutConnexion();   // la liste des élèves a pu changer pendant la gestion
      S.etat = null; S.annuaire = null; S.vue = null;
      location.hash = ""; break;
    case "gtab": S.gtab = d.t; rendre(); break;
    case "g-tout": S.gTout = true; rendre(); break;
    case "g-mon-code": formMonCode(); break;
    case "g-code-plus-tard": SS.set("colloscope-code-plus-tard", "1"); rendre(); break;
    case "g-annul":
      if (d.on === "1") feuilleFormulaire({
        titre: "Annuler la séance du " + dateLongue(d.date),
        intro: "Les élèves inscrits sont désinscrits et prévenus sur leur page d'accueil.",
        champs: [{ id: "motif", label: "Motif affiché aux élèves", aide: "Facultatif", placeholder: "Colleur absent" }],
        bouton: "Annuler la séance",
        envoyer: function (v) { return opGestion("annulation", { source: d.src, date: d.date, annuler: true, motif: v.motif }, "Séance annulée"); }
      });
      else opGestion("annulation", { source: d.src, date: d.date, annuler: false }, "Séance rétablie");
      break;
    case "g-desinscrire":
      feuilleConfirmer("Retirer " + d.n + " ?", '<p class="note" style="font-size:14px">La place redevient libre. L\'élève est prévenu sur sa page d\'accueil.</p>', "Retirer", true, function () {
        return opGestion("desinscrire", { creneau: d.c, eleve: d.n }, "Élève retiré");
      }); break;
    case "g-absent": el.disabled = true; opGestion("absence", { creneau: d.c, eleve: d.n, absent: d.on === "1" }, d.on === "1" ? d.n + " noté absent" : d.n + " noté présent").then(function (r) { if (r && !r.ok) { el.disabled = false; toast(r.error, false); } }); break;
    case "g-regle": formRegle(d.id); break;
    case "g-libre": formColleLibre(d.id); break;
    case "cl-plus": var zone = $("#cl-seances"), der = zone.querySelectorAll('[data-r="date"]'); zone.insertAdjacentHTML("beforeend", ligneSaisieSeance(der.length ? der[der.length - 1].value : $("#cl-debut").value)); break;
    case "cl-moins": el.closest(".seance-saisie").remove(); break;
    case "g-params": var mp = S.g.matieres.filter(function (x) { return x.id === S.gm; })[0]; if (mp) formParams(mp); break;
    case "g-detail":
      var md = S.g.matieres.filter(function (x) { return x.id === S.gm; })[0], wd = md && md.semaines.filter(function (x) { return x.lundi === d.l; })[0];
      if (wd) formDetail(md, wd); break;
    case "g-modif":
      var mm = S.g.matieres.filter(function (x) { return x.id === S.gm; })[0], sm = seanceGestion(d.src, d.date);
      if (sm && sm.type === "ponctuel") formPonctuel(sm.source);
      else if (sm && mm) formModifSeance(mm, sm);
      break;
    case "g-colleur": formColleur(d.m); break;
    case "g-colleur-code":
      feuilleConfirmer("Nouveau code pour " + d.n + " ?", '<p class="note" style="font-size:14px">Son code actuel ne marchera plus. Il faudra lui donner le nouveau.</p>', "Créer un nouveau code", false, function () {
        return api(gp({ action: "gestion", op: "colleur_code", data: { nom: d.n } })).then(function (r) { if (!r.ok) return r; return chargerGestion().then(function () { montrerCode(d.n, r.code); }); });
      }); break;
    case "g-colleur-suppr":
      feuilleConfirmer("Retirer " + d.n + " ?", '<p class="note" style="font-size:14px">Il n\'aura plus accès à ses colles de ' + esc(d.m) + '. Ses séances restent dans le planning.</p>', "Retirer", true, function () {
        return opGestion("colleur_suppr", { nom: d.n, matiere: d.m }, "Colleur retiré");
      }); break;
    case "g-ressource": formRessource(); break;
    case "r-type":
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="r-type"]'), function (b) { b.setAttribute("aria-pressed", String(b === el)); });
      $("#r-zone-fichier").hidden = d.t !== "fichier"; $("#r-zone-lien").hidden = d.t !== "lien"; break;
    case "g-ressource-suppr":
      feuilleConfirmer("Retirer « " + d.t + " » ?", '<p class="note" style="font-size:14px">Les élèves ne le verront plus. Un fichier déposé ici part aussi à la corbeille du Drive.</p>', "Retirer", true, function () {
        return opGestion("ressource_suppr", { id: d.id }, "Document retiré");
      }); break;
    case "a-code": formCodeMatiere(d.nom); break;
    case "a-profs": formProfs(); break;
    case "a-prof-code":
      feuilleConfirmer("Nouveau code pour " + d.n + " ?", '<p class="note" style="font-size:14px">L\'ancien code (ou celui qu\'il avait choisi) ne marchera plus, y compris sur les appareils où il était enregistré. Pense à donner le nouveau.</p>',
        "Créer un nouveau code", false, function () { return opGestion("prof_code", { nom: d.n }, "Nouveau code créé"); });
      break;
    case "a-unifier":
      ouvrirFeuille('<h3>Un seul code par matière</h3><p class="note" style="font-size:14px">Chaque matière gardera, dans toutes les classes, le code qu\'elle a dans la classe choisie. Chaque prof n\'aura plus qu\'un code. Les autres codes ne marcheront plus.</p>' +
        '<div class="pied-feuille">' + S.g.classes.map(function (c) { return '<button class="btn plein" data-act="a-unifier-ok" data-c="' + esc(c.id) + '">Garder les codes de ' + esc(c.nom) + '</button>'; }).join("") +
        '<button class="btn plein discret" data-act="fermer">Annuler</button></div>', "Un seul code par matière");
      break;
    case "a-unifier-ok": opGestion("codes_unifier", { classe: d.c }, "Un code par matière"); break;
    case "g-ponctuel": formPonctuel(d.id); break;
    case "a-matiere": formMatiere(d.id); break;
    case "a-classe": formClasse(d.id); break;
    case "a-eleves": formEleves(d.id); break;
    case "a-codes": feuilleCodes(d.id); break;
    case "a-acces":
      feuilleFormulaire({

        envoyer: function (v) { return opGestion("code_acces", v, "Code d'accès modifié"); }

        '<p class="note" style="font-size:14px">Tout le monde pourra réserver dès maintenant ; les élèves qui l\'ont demandé reçoivent une notification. Préviens aussi la classe, pour que chacun ait sa chance.</p>',
        "Ouvrir maintenant", false, function () { return opGestion("ouverture", { matiere: d.m, lundi: d.l, ouvrir: true }, "Inscriptions ouvertes"); });
      else feuilleConfirmer("Revenir à l'ouverture automatique ?",
        '<p class="note" style="font-size:14px">Si la date prévue n\'est pas encore passée, la colle sera refermée. Les inscriptions déjà faites sont conservées.</p>',
        "Revenir à l'automatique", true, function () { return opGestion("ouverture", { matiere: d.m, lundi: d.l, ouvrir: false }, "Ouverture automatique rétablie"); });
      break;

          { id: "ouverture_heure", label: "Heure d'ouverture", valeur: hc(S.g.reglages.ouverture_heure), placeholder: "12h" },
          { id: "debut_annee", label: "Date de rentrée", aide: "Sert à numéroter les colles (Colle 1, 2, 3…). À changer chaque année.", type: "date", valeur: S.g.reglages.debut_annee },
          { id: "absences_depuis", label: "Absences automatiques à partir du", aide: "Un élève qui ne s'est pas inscrit à une colle terminée après cette date est compté absent.", type: "date", valeur: S.g.reglages.absences_depuis }
        ],
        envoyer: function (v) { return opGestion("reglages", v, "Réglage enregistré"); }
      }); break;
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("#calques").innerHTML) fermerFeuille(); });
function rafraichir() {
  var hs = location.hash;
  if (S.rafraichit || document.visibilityState !== "visible" || !profilComplet() || !S.etat || $("#calques").innerHTML || hs === "#gestion" || hs.indexOf("#v~") === 0) return;
  S.rafraichit = true;
  chargerEtat(true).then(function () { S.rafraichit = false; }, function () { S.rafraichit = false; });
}
document.addEventListener("visibilitychange", rafraichir);
setInterval(rafraichir, 60000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ajusterSelect($("#sel-gm")); });

/* ---------- Service worker : démarrage immédiat, notifications, nouvelles versions ---------- */
if (!DEMO && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  var avaitControleur = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(function (reg) {
    PUSH.reg = reg;
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
  }).catch(function () {});
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (avaitControleur) { S.nouvelleVersion = true; rendre(); } });
  // Notification touchée alors que le site est ouvert : on va directement à la bonne page
  navigator.serviceWorker.addEventListener("message", function (e) {
    if (e.data && e.data.type === "nouvelle-version") { S.nouvelleVersion = true; rendre(); return; }
    if (!e.data || e.data.type !== "ouvrir") return;
    var hsh = String(e.data.url).split("#")[1] || "";
    fermerFeuille();
    if (location.hash.replace("#", "") === hsh) rendre(); else location.hash = hsh;
    if (profilComplet()) chargerEtat(true);
  });
  navigator.serviceWorker.ready.then(function (reg) { PUSH.reg = reg; verifierAbonnement(); }).catch(function () {});
}

S.etat = etatMemorise();
if (S.etat) { S.maj = true; chargerEtat(true); }
rendre();
